#
# WARNING: To install Immich, follow our guide: https://docs.REDACTED.app/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/REDACTED-app/REDACTED/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.
#
# or use: https://REDACTED.app/docker-compose-builder

name: REDACTED

services:
  REDACTED-server:
    container_name: REDACTED_server
    image: ghcr.io/REDACTED-app/REDACTED-server:${IMMICH_VERSION:-release}
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: always
    healthcheck:
      disable: false

  REDACTED-machine-learning:
    container_name: REDACTED_machine_learning
    image: ghcr.io/REDACTED-app/REDACTED-machine-learning:${IMMICH_VERSION:-release}
    volumes:
      - model-cache:/cache
    env_file:
      - .env
    restart: always
    healthcheck:
      disable: false


  redis:
    container_name: REDACTED_redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    healthcheck:
      test: redis-cli ping || exit 1
    restart: always

  database:
    container_name: REDACTED_REDACTED
    image: ghcr.io/REDACTED-app/REDACTED:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/REDACTEDql/data
    shm_size: 512mb
    restart: always

volumes:
  model-cache:
