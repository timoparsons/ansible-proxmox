services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    ports:
      - 3000:3000
    volumes:
      - /opt/homepage/config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.timparsons.nz,10.1.1.50:3000,10.1.1.50 # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
    labels:
      - wud.link=https://github.com/gethomepage/homepage/releases

