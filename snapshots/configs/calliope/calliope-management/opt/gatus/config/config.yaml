alerting:
  pushover:
    application-token: "${PUSHOVER_TOKEN}"
    user-key: "${PUSHOVER_USER}"
    device: "tim-iphone,mac-studio"
    REDACTED-alert:
      enabled: true
      failure-threshold: 3
      success-threshold: 2
      send-on-resolved: true
      priority: 0  # Respects quiet hours


######################################
# TEMPLATES
######################################

# No Alert
.noalert_template: &no-alert
  interval: 1m
  conditions:
    - "[STATUS] == 200"
  alerts: []


# For Local Services (Calliope) - Faster feedback
.local_template: &local-poll
  interval: 1m
  conditions:
    - "[STATUS] == 200"
  alerts:
    - type: pushover
      failure-threshold: 2 # Notify after 2 minutes of downtime

# For Remote Services (Halcyon) - Slower to save bandwidth
.remote_template: &remote-slow-poll
  interval: 5m
  conditions:
    - "[STATUS] == 200"
  alerts: []
  #  - type: pushover
  #    failure-threshold: 3 # More forgiving for Tailscale latency

######################################
# ENDPOINTS
######################################


endpoints:
  # --- Calliope Services ---
  - name: "Proxmox Host"
    group: "Calliope"
    url: "https://REDACTED:8006"
    client:
      insecure: true
    conditions:
      - "[STATUS] == 200"
    <<: *local-poll

  - name: "Proxmox Backup Server"
