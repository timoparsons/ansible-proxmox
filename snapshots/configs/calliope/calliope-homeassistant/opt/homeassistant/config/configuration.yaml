#default_config:

# Replaced with the following to remove cloud.
#automation:
#backup:
bluetooth:
config:
conversation:
counter:
dhcp:
energy:
#frontend:
hardware:
history:
homeassistant_alerts:
#cloud:
image_upload:
#input_boolean:
input_button:
input_datetime:
input_number:
input_select:
input_text:
logbook:
#logger:
#map:
media_source:
mobile_app:
