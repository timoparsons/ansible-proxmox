# Home Assistant LXC: Define database location.
recorder:
  db_url: sqlite:////database/home-assistant_v2.db
  # Optional: other recorder settings
  purge_keep_days: 30
  commit_interval: 1

# Set external database to MariaDB (running in LXC at 10.1.1.56)
#recorder:
#  db_url: mysql://REDACTED@10.1.1.56:3306/homeassistant?charset=utf8mb4

# Set Logging level
logger:
  REDACTED warning
  logs:
    ffmpeg: debug

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
    #- /hacsfiles/lovelace-card-mod/card-mod.js #Manually add card-mod for better functionality
    - /hacsfiles/lovelace-card-mod/card-mod.js?hacstag=190927524421
    - /hacsfiles/lovelace-card-mod/lovelace-html-card/html-card.js


# Customize radius of Home zone
homeassistant:
  customize:
    zone.home:
      radius: 20
  # Include packages directory
  packages: !include_dir_named packages

# Text to speech
tts:
  - platform: google_translate

# Non standard port for security
http:
  server_port: 8443 # Use your chosen port
  # These lines for Cloudflared
  use_x_forwarded_for: true
  trusted_proxies:
    - 10.1.1.24    # Cloudflared LXC
    #- 172.30.33.0/24 # Internal Cludflared Add-On

# ffmpeg DISABLED FOR HAOS
ffmpeg: # Only need this line for HAOS
#  ffmpeg_bin: /opt/homebrew/bin/ffmpeg


# External file includes
automation: !include automations.yaml
binary_sensor: !include binary_sensors.yaml
command_line: !include command_line.yaml
#crowipmodule: !include crowipmodule.yaml # Alarm integration
#go2rtc: !include go2rtc.yaml  # Disabled - now using go2rtc in frigate.lxc
group: !include groups.yaml
input_boolean: !include input_boolean.yaml
#light: !include lights.yaml
rest: !include rest.yaml
sensor: !include sensors.yaml
scene: !include scenes.yaml
script: !include scripts.yaml
shell_command: !include shell_commands.yaml
template: !include templates.yaml


# MQTT Sensor
mqtt:
  sensor:
    - name: "Latest Frigate Event"
      state_topic: "frigate/events"
      value_template: "{{ value_json['after']['id'] }}"


# UPS REST Commands

rest_command:
  ups_set_shutdown_delay:
    url: "http://10.1.1.20:8080/ups/shutdown-delay?delay={{ delay | default(180) }}"
    method: POST
    timeout: 15

  ups_load_off:
    url: "http://10.1.1.20:8080/ups/load-off"
    method: POST
    timeout: 15

  ups_load_off_delay:
    url: "http://10.1.1.20:8080/ups/load-off-delay"
    method: POST
    timeout: 15

  ups_shutdown_reboot:
    url: "http://10.1.1.20:8080/ups/shutdown-reboot"
    method: POST
    timeout: 15

  ups_shutdown_stop:
    url: "http://10.1.1.20:8080/ups/shutdown-stop"
    method: POST
    timeout: 15

  ups_beeper_disable:
    url: "http://10.1.1.20:8080/ups/beeper-disable"
    method: POST
    timeout: 15

  ups_beeper_enable:
    url: "http://10.1.1.20:8080/ups/beeper-enable"
    method: POST
    timeout: 15

  ups_set_battery_charge_low:
    url: "http://10.1.1.20:8080/ups/battery-charge-low?value={{ value | default(10) }}"
    method: POST
    timeout: 15

  ups_set_battery_runtime_low:
    url: "http://10.1.1.20:8080/ups/battery-runtime-low?value={{ value | default(120) }}"
    method: POST
    timeout: 15


