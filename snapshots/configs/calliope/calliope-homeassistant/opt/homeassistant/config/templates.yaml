# Projector Volume Light
- light:
    - name: "Projector Volume"
      unique_id: projector_volume_templatelight
      state: "{{ states('sensor.projector_volume') != '0' }}"
      level: "{{ (states('sensor.projector_volume') | int(default=0) / 50) * 255 }}"
      turn_on:
        action: script.projector_mute_toggle
      turn_off:
        action: script.projector_mute_toggle
      set_level:
        action: script.projector_volume_slider_level
        data:
          brightness: "{{ brightness }}"

# TV Room Volume Light
- light:
    - name: "TV Room Volume"
      unique_id: tv_room_volume_templatelight
      state: "{{ not state_attr('media_player.tv_room', 'is_volume_muted') and state_attr('media_player.tv_room', 'volume_level') | float(0) > 0 }}"
      level: "{{ (state_attr('media_player.tv_room', 'volume_level') | float(0) * 255) | int }}"
      turn_on:
        action: media_player.volume_mute
        data:
          entity_id: media_player.tv_room
          is_volume_muted: false
      turn_off:
        action: media_player.volume_mute
        data:
          entity_id: media_player.tv_room
          is_volume_muted: true
      set_level:
        action: media_player.volume_set
        data:
          entity_id: media_player.tv_room
          volume_level: "{{ brightness / 255 }}"

# Convert Uptime Sensor to a duration showing how long Home Assistant has been running
- sensor:
  - default_entity_id: sensor.uptime_minutes
    name: Uptime Minutes
    state: '{{ (as_timestamp(now()) - as_timestamp(states(''sensor.uptime''))) //
      60| round (0)  }}'



