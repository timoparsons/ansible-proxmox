- sensor:
  - default_entity_id: sensor.ups_status_readable
    icon: "{% set status = states('sensor.calliope_ups_status_data') %} {% set battery_level
      = states('sensor.calliope_ups_battery_charge') | int %} {% if status == 'OL'
      %}\n  mdi:power-plug\n{% elif status == 'OL CHRG' %}\n  {% if battery_level
      >= 90 %}\n    mdi:battery-charging-100\n  {% elif battery_level >= 80 %}\n    mdi:battery-charging-90\n
      \ {% elif battery_level >= 70 %}\n    mdi:battery-charging-80\n  {% elif battery_level
      >= 60 %}\n    mdi:battery-charging-70\n  {% elif battery_level >= 50 %}\n    mdi:battery-charging-60\n
      \ {% elif battery_level >= 40 %}\n    mdi:battery-charging-50\n  {% elif battery_level
      >= 30 %}\n    mdi:battery-charging-40\n  {% elif battery_level >= 20 %}\n    mdi:battery-charging-30\n
      \ {% elif battery_level >= 10 %}\n    mdi:battery-charging-20\n  {% else %}\n
      \   mdi:battery-charging-10\n  {% endif %}\n{% elif status == 'OB' %}\n  mdi:battery-alert\n{%
      elif status == 'OB DISCHRG' %}\n  mdi:battery-alert\n{% else %}\n  mdi:power\n{%
      endif %}"
    name: UPS Status Readable
    state: "{% set status = states('sensor.calliope_ups_status_data') %} {% if status
      == 'OL' %}\n  ONLINE\n{% elif status == 'OL CHRG' %}\n  CHARGING\n{% elif status
      == 'OB' %}\n  ON BATTERY\n{% elif status == 'LB' %}\n  LOW BATTERY\n{% elif
      status == 'RB' %}\n  REPLACE BATTERY\n{% elif status == 'OB DISCHRG' %}\n  DISCHARGING\n{%
      else %}\n  {{ status }}\n{% endif %}"

