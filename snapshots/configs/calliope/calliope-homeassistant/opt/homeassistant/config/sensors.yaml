# ESPresence Config
- platform: mqtt_room
  device_id: "phone:tim-iphone14"
  name: "espresence_tim_iphone"
  state_topic: "espresense/devices/phone:tim-iphone14"
  timeout: 60
  away_timeout: 90

# Tide information
- platform: niwa_tides
  REDACTED: !secret niwa_tides_REDACTED
  entity_id: "local_tides"
  name: Local Tides

# 1. MAC Temperature
- platform: snmp
  name: "XS708T MAC Temperature"
  host: 10.1.1.6
  community: homeassistant
  version: "2c"
  baseoid: .1.3.6.1.4.1.4526.11.43.1.8.1.5.1.0
  unit_of_measurement: "°C"
  value_template: "{{ value | int }}"

# 2. PHY Temperature
- platform: snmp
  name: "XS708T PHY Temperature"
  host: 10.1.1.6
  community: homeassistant
  version: "2c"
  baseoid: .1.3.6.1.4.1.4526.11.43.1.8.1.5.1.1
  unit_of_measurement: "°C"
  value_template: "{{ value | int }}"

# 3. Fan Speed RPM
- platform: snmp
  name: "XS708T Fan Speed RPM"
  host: 10.1.1.6
  community: homeassistant
  version: "2c"
  baseoid: .1.3.6.1.4.1.4526.11.43.1.6.1.4.1.0
  unit_of_measurement: "RPM"
  value_template: "{{ value | int }}"

# 4. Fan Duty Cycle
- platform: snmp
  name: "XS708T Fan Duty Cycle"
  host: 10.1.1.6
  community: homeassistant
  version: "2c"
  baseoid: .1.3.6.1.4.1.4526.11.43.1.6.1.5.1.0
  unit_of_measurement: "%"
  value_template: "{{ value | int }}"
