# Projector
projector_off: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=power"
projector_hdmi1: curl -s "http://10.1.1.80:6095/controller?action=changesource&source=hdmi1"
projector_hdmi2: curl -s "http://10.1.1.80:6095/controller?action=changesource&source=hdmi2"
projector_up: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=up"
projector_down: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=down"
projector_left: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=left"
projector_right: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=right"
projector_volumeup: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=volumeup"
projector_volumedown: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=volumedown"
projector_enter: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=enter"
projector_home: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=home"
projector_back: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=back"
projector_menu: curl -s "http://10.1.1.80:6095/controller?action=keyevent&keycode=menu"
