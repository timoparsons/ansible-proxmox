###################################################################################################
## PACKAGE: Unavailable Entities Sensor
## DESCRIPTION: Count and list entities with a state of unavailable, and the devices they belong to
## ORIGINAL: https://github.com/jazzyisj/unavailable-entities-sensor/blob/main/README.md
## CHANGED 2026-11-07: only counts "unavailable" (not "unknown"), waits 15 minutes before counting,
##   skips noisy domains and entity names (see skip_domains / skip_pattern below), adds
##   sensor.offline_devices (devices instead of entities) and a one-line notification.
##   Each sensor computes its state directly (not from its own attribute) because template
##   sensors restore their last attributes after a reload, which kept the old values.
##   Backup of the original: package_unavailable_entities.yaml.bak-2026-11-07-filter
###################################################################################################

template:
  - sensor:
      - name: "Unavailable Entities"
        unique_id: unavailable_entities
        icon: "{{ iif(states(this.entity_id)|int(-1) > 0, 'mdi:alert-circle', 'mdi:check-circle') }}"
        state_class: measurement
        unit_of_measurement: entities
        # Keep the filter in "state" and in the "entity_id" attribute identical.
        state: >
          {% set ignore_seconds = 900 %}
          {% set ignored = state_attr('group.ignored_unavailable_entities', 'entity_id') or [] %}
          {% set ignore_ts = (now().timestamp() - ignore_seconds)|as_datetime %}
          {# Domains that are never counted #}
          {% set skip_domains = ['button','conversation','event','group','image','input_button','input_text','notify','number','person','remote','scene','select','stt','text','tts','update'] %}
          {# Entities whose id contains any of these words are never counted (phones, dishwasher, idle-only sensors) #}
          {% set skip_pattern = 'iphone|macbook|mac_studio|mac_wifi|dishwasher|last_seen|last_replaced|thread_|scrub_progress|nanoleaf|celeste_bedroom' %}
          {{ states
              | rejectattr('domain','in',skip_domains)
              | selectattr('state','eq','unavailable')
              | rejectattr('last_changed','ge',ignore_ts)
              | map(attribute='entity_id')
              | reject('in',ignored)
              | reject('search',skip_pattern)
              | list | count }}
        attributes:
          entity_id: >
            {% set ignore_seconds = 900 %}
            {% set ignored = state_attr('group.ignored_unavailable_entities', 'entity_id') or [] %}
            {% set ignore_ts = (now().timestamp() - ignore_seconds)|as_datetime %}
            {# Domains that are never counted #}
            {% set skip_domains = ['button','conversation','event','group','image','input_button','input_text','notify','number','person','remote','scene','select','stt','text','tts','update'] %}
            {# Entities whose id contains any of these words are never counted (phones, dishwasher, idle-only sensors) #}
            {% set skip_pattern = 'iphone|macbook|mac_studio|mac_wifi|dishwasher|last_seen|last_replaced|thread_|scrub_progress|nanoleaf|celeste_bedroom' %}
            {{ states
                | rejectattr('domain','in',skip_domains)
                | selectattr('state','eq','unavailable')
                | rejectattr('last_changed','ge',ignore_ts)
                | map(attribute='entity_id')
                | reject('in',ignored)
                | reject('search',skip_pattern)
                | sort | list }}

      - name: "Offline Devices"
        unique_id: offline_devices
        icon: "{{ iif(states(this.entity_id)|int(-1) > 0, 'mdi:lan-disconnect', 'mdi:lan-check') }}"
        state_class: measurement
        unit_of_measurement: devices
        # Keep the loop in "state" and in the "devices" attribute identical.
        state: >
          {% set ents = state_attr('sensor.unavailable_entities', 'entity_id') or [] %}
          {% set ns = namespace(names=[]) %}
          {%- for e in ents -%}
            {%- set d = device_id(e) -%}
            {%- if d -%}
              {%- set n = device_attr(d, 'name_by_user') or device_attr(d, 'name') -%}
            {%- else -%}
              {%- set n = state_attr(e, 'friendly_name') or e -%}
            {%- endif -%}
            {%- if n not in ns.names -%}{%- set ns.names = ns.names + [n] -%}{%- endif -%}
          {%- endfor -%}
          {{ ns.names | count }}
        attributes:
          devices: >
            {% set ents = state_attr('sensor.unavailable_entities', 'entity_id') or [] %}
            {% set ns = namespace(names=[]) %}
            {%- for e in ents -%}
              {%- set d = device_id(e) -%}
              {%- if d -%}
                {%- set n = device_attr(d, 'name_by_user') or device_attr(d, 'name') -%}
              {%- else -%}
                {%- set n = state_attr(e, 'friendly_name') or e -%}
              {%- endif -%}
              {%- if n not in ns.names -%}{%- set ns.names = ns.names + [n] -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.names | sort }}

# Exact entity ids to ignore (no wildcards). the upstream placeholder, nothing to ignore at the moment.

group:
  ignored_unavailable_entities:
    entities:
      - sensor.example_ignored_entity

# One short persistent notification naming the offline devices, dismissed when there are none.

automation:
  - id: unavailable_entities_notification
    alias: "Unavailable Entities Notification"
    description: "Create a one-line persistent notification naming offline devices, dismiss if none."
    mode: restart
    triggers:
      - trigger: state
        entity_id: sensor.offline_devices
    conditions:
      - alias: "Sensor state is a valid numerical value"
        condition: template
        value_template: "{{ states('sensor.offline_devices') | is_number }}"
    actions:
      - if:
          - condition: numeric_state
            entity_id: sensor.offline_devices
            below: 1
        then:
          - action: persistent_notification.dismiss
            data:
              notification_id: unavailable_entities
        else:
          - action: persistent_notification.create
            data:
              notification_id: unavailable_entities
              title: "Offline devices"
              message: >
                {% set d = state_attr('sensor.offline_devices', 'devices') | list %}
                {% set n = d | count %}
                {{ n }} offline: {{ d[:8] | join(', ') }}{% if n > 8 %} and {{ n - 8 }} more{% endif %}
