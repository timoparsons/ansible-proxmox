latte_custom:
  __extend: catppuccin-latte
  # Padding at bootom for nav-bar-card
  card-mod-theme: Catppuccin Latte
  card-mod-root-yaml: |
    .: |
      @media (min-width: 768px) {
        hui-sections-view {
          padding-bottom: 120px !important;
        }
      }
      @media (max-width: 767px) {
        :not(.edit-mode) > hui-view:after {
          content: "";
          display: block;
          height: 80px;
          width: 100%;
          background-color: transparent;
        }
      }


  ha-card-border-width: 0px


