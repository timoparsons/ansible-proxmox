      card-mod-drawer: "/* Put the same wallpaper behind the sidebar's glass, including on\n   configuration panels. A pseudo-element on the sidebar owns its blur. */\n.sidebar-shell,\n.mdc-drawer {\n  background: var(--lovelace-background, var(--background-image));\n  border-inline-end: 0.5px solid var(--sidebar-border-color);\n}\n.mdc-drawer__content {\n  background: transparent;\n}\nwa-drawer::part(dialog) {\n  background: var(--lovelace-background, var(--background-image));\n  border-inline-end: 0.5px solid var(--sidebar-border-color);\n}\n:host {\n  --mdc-drawer-scrim-color: var(--mdc-dialog-scrim-color);\n}\n"
