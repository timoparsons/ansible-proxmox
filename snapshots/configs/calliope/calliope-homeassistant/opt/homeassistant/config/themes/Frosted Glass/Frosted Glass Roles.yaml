      card-mod-card: "/* Keep fixed-position menus in the viewport coordinate system. */\nha-card {\n  background: transparent;\n  backdrop-filter: none;\n  -webkit-backdrop-filter: none;\n  position: relative;\n  isolation: isolate;\n}\n\n/* Keep one crisp reflection on the blur layer, with depth on the card.\n   Native fallback surfaces and direct-filter cards retain their shadow. */\n:where(:host(:not(mushroom-template-card):not(navbar-card):not(.type-custom-navbar-card))) ha-card {\n  --ha-card-box-shadow: var(--frosted-glass-card-depth-shadow);\n}\n\n/* Low specificity lets per-card artwork override the glass layer. */\n:where(:host(:not(mushroom-template-card):not(room-summary-card))) ha-card::before {\n  content: var(--frosted-glass-card-layer-content, '');\n  position: absolute;\n  inset: 0;\n  background: REDACTED\n  /* Paint the reflection on the filtered layer so blur cannot erase it. */\n  box-shadow: var(--ha-card-glass-inset-shadow);\n  backdrop-filter: var(--ha-card-backdrop-filter);\n  -webkit-backdrop-filter: var(--ha-card-backdrop-filter);\n  z-index: -1;\n  pointer-events: none;\n  border-radius: inherit;\n}\n\n/* Containers and text-only cards leave their content's surface intact. */\n:host(hui-heading-card) ha-card,\n:host(.text-only) ha-card,\nha-card.text-only,\n:host(mushroom-title-card) ha-card,\n:host(mushroom-chips-card) ha-card {\n  --ha-card-background: transparent;\n  --ha-card-backdrop-filter: none;\n  --ha-card-box-shadow: none;\n  --frosted-glass-card-layer-content: none;\n  background: none !important;\n  backdrop-filter: none !important;\n  -webkit-backdrop-filter: none !important;\n  box-shadow: none !important;\n  border: none !important;\n}\n:host(hui-heading-card) ha-card::before,\n:host(.text-only) ha-card::before,\nha-card.text-only::before,\n:host(mushroom-title-card) ha-card::before,\n:host(mushroom-chips-card) ha-card::before {\n  content: none !important;\n}\n\n/* Bubble owns its rounded surface. Its blur layer cannot trap fixed menus. */\n:host(bubble-card) ha-card,\n:host(.type-custom-bubble-card) ha-card,\nha-card:has(.bubble-container) {\n  background: none !important;\n  backdrop-filter: none !important;\n  -webkit-backdrop-filter: none !important;\n  border-radius: 0 !important;\n}\n:host(bubble-card) ha-card::before,\n:host(.type-custom-bubble-card) ha-card::before,\nha-card:has(.bubble-container)::before {\n  content: none !important;\n}\n:where(:host(bubble-card), :host(.type-custom-bubble-card)) ha-card,\nha-card:where(:has(.bubble-container)) {\n  box-shadow: none;\n  border: none;\n}\n.bubble-container {\n  background: transparent !important;\n  box-shadow: var(--bubble-box-shadow);\n}\n.bubble-background {\n  background: transparent !important;\n  transition: none;\n}\n.bubble-container::before {\n  content: '';\n  position: absolute;\n  inset: 0;\n  border-radius: inherit;\n  pointer-events: none;\n  box-shadow: var(--ha-card-glass-inset-shadow);\n  backdrop-filter: var(--ha-card-backdrop-filter);\n  -webkit-backdrop-filter: var(--ha-card-backdrop-filter);\n}\n\n/* Transparent Hue surfaces need the theme's matching foreground. */\n:host(hue-like-light-card) ha-card,\n:host(.type-custom-hue-like-light-card) ha-card {\n  --hue-text-color: var(--primary-text-color);\n  background: transparent !important;\n  color: var(--primary-text-color) !important;\n}\n\n/* Navbar resolves its native background against card-background-color.\n   Scope the transparent base here; menus elsewhere keep their opaque base.\n   Public --navbar-background-color overrides remain owned by the card/user. */\n:host(navbar-card),\n:host(.type-custom-navbar-card) {\n  --card-background-color: var(--ha-card-background, transparent);\n  --material-shadow-elevation-2dp: var(--ha-card-box-shadow);\n}\n.navbar ha-card,\n:host(navbar-card) ha-card,\n:host(.type-custom-navbar-card) ha-card {\n  --frosted-glass-card-layer-content: none;\n  box-shadow: var(--navbar-box-shadow-desktop, var(--ha-card-box-shadow));\n  background: var(--navbar-background-color, transparent);\n  backdrop-filter: var(--navbar-backdrop-filter);\n  -webkit-backdrop-filter: var(--navbar-backdrop-filter);\n  border: var(--ha-card-border);\n}\n:host(navbar-card) .popup-item .button {\n  backdrop-filter: var(--navbar-backdrop-filter);\n  -webkit-backdrop-filter: var(--navbar-backdrop-filter);\n  border: var(--ha-card-border);\n}\n\n:host(:where(slider-button-card, .type-custom-slider-button-card)) {\n  --btn-bg-color-off: var(--frosted-glass-slider-button-off);\n  --btn-bg-color-on: var(--frosted-glass-slider-button-on);\n  --slider-track-color: var(--frosted-glass-slider-track);\n}\n\n/* Room Summary already paints its own corner reflections. */\n:where(:host(room-summary-card)) ha-card {\n  --ha-card-box-shadow: var(--frosted-glass-card-depth-shadow);\n}\n\n/* Leave both pseudo-elements available for Mushroom template artwork. */\n:host(mushroom-template-card) ha-card {\n  background: transparent !important;\n  backdrop-filter: var(--ha-card-backdrop-filter);\n  -webkit-backdrop-filter: var(--ha-card-backdrop-filter);\n}\n\n/* stack-in-card writes this inline only when keep.background is false and\n   --keep-background is not true. Honor that decision instead of hiding every\n   descendant, including those whose background was explicitly kept. */\nha-card[style*=\"background: transparent\"] {\n  --ha-card-backdrop-filter: none;\n  backdrop-filter: none;\n  -webkit-backdrop-filter: none;\n  border: none;\n}\nha-card[style*=\"background: transparent\"]::before {\n  content: none !important;\n}\n\n.mdc-data-table {\n  background: none !important;\n}\n.mdc-data-table__header-cell {\n  background: var(--frosted-glass-control-surface);\n}\n"
