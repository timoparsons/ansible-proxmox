      bubble-accent-color: rgb(106, 116, 211)
      bubble-icon-border-radius: 14px
      bubble-icon-background-color: rgba(255, 255, 255, 0.38)
      bubble-sub-button-border-radius: 12px
      bubble-sub-button-background-color: rgba(255, 255, 255, 0.34)
      bubble-box-shadow: var(--frosted-glass-card-depth-shadow)
      bubble-border: 0.5px solid rgba(255, 255, 255, 0.19)
