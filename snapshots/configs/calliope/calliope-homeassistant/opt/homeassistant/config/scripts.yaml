master_bedroom_bedside_lamps_toggle_both:
  alias: Master Bedroom – Bedside Lamps – Toggle BOTH
  description: Toggles both bedside lamps together. If either lamp is on, turn both
    off; if both are off, turn both on. Called by a double press on either bedside
    controller. Turning a lamp off also cancels its motion timer via the timer-finish
    automation.
  icon: mdi:lamps
  mode: single
  sequence:
  - choose:
    - alias: 'Either lamp on: turn both off'
      conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: light.bedside_tim
          state: 'on'
        - condition: state
          entity_id: light.bedside_sonya
          state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id:
          - light.bedside_tim
          - light.bedside_sonya
    REDACTED
    - action: light.turn_on
      target:
        entity_id:
        - light.bedside_tim
        - light.bedside_sonya
