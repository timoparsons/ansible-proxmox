sonos_queue:
  alias: Sonos Queue
  sequence:
  - variables:
      sonos_player: media_player.lounge
  - action: sonos.get_queue
    target:
      entity_id: '{{ sonos_player }}'
    response_variable: queue
  - data:
      title: Sonos Queue Debug
      message: "Player: {{ sonos_player }}\n{% set queue_position = state_attr(sonos_player,
        'queue_position') | int %}\n{% set queue_size = state_attr(sonos_player, 'queue_size')
        | int %}\n{% set start_position = (queue_position - 1) if queue_position >
        0 else 0 %}\n{% set items = queue[sonos_player] %}\nQueue Position: {{ queue_position
        }} of {{ queue_size }}\nQueue Contents:\n{% if items %}\n  {% for item in
        items[start_position:start_position + 15] %}\n    {{ loop.index + start_position
        }}. {{ item }}\n  {% endfor %}\n{% else %}\n  No items in queue\n{% endif
        %}\n"
    action: persistent_notification.create
