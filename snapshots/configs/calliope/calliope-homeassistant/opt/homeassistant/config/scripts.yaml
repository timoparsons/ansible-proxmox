      target:
        entity_id: sensor.projector_volume
  mode: single
projector_volume_down:
  alias: Entertainment – Projector – Volume DOWN
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.projector_status
      state: 'on'
    then:
    - service: shell_command.projector_volumedown
