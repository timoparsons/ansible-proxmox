  mode: single
projector_mute_toggle:
  alias: Entertainment – Projector – Mute Toggle
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.projector_status
      state: 'on'
    then:
    - variables:
        projector_volume: '{{ states(''sensor.projector_volume'') | int }}'
    - service: homeassistant.update_entity
      data: {}
      target:
        entity_id: sensor.projector_volume
    - if:
      - condition: and
        conditions:
        - condition: numeric_state
          entity_id: sensor.projector_volume
          below: 1
        - condition: state
          entity_id: binary_sensor.projector_status
          state: 'on'
      then:
      - if:
        - condition: numeric_state
          entity_id: input_number.projector_unmute_volume
          above: 1
        then:
        - repeat:
            count: '{{ states(''input_number.projector_unmute_volume'') | int }}'
            sequence:
            - service: shell_command.projector_volumeup
              data: {}
        else:
        - repeat:
            count: '25'
            sequence:
            - service: shell_command.projector_volumeup
              data: {}
      - service: homeassistant.update_entity
        data: {}
        target:
          entity_id: sensor.projector_volume
      - service: input_number.set_value
        data:
          entity_id: input_number.projector_unmute_volume
          value: '{{ projector_volume }}'
      else:
      - if:
        - condition: state
          entity_id: binary_sensor.projector_status
          state: 'on'
        then:
        - service: input_number.set_value
          data:
            entity_id: input_number.projector_unmute_volume
            value: '{{ projector_volume }}'
        - repeat:
            count: '{{ states(''input_number.projector_unmute_volume'') | int }}'
            sequence:
            - service: shell_command.projector_volumedown
              data: {}
    - service: homeassistant.update_entity
      data: {}
      target:
        entity_id: sensor.projector_volume
  mode: single
projector_volume_slider_level:
  alias: Projector – Volume – Slider Level
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.projector_status
      state: 'on'
    then:
    - data:
        entity_id:
        - sensor.projector_volume
      target:
        entity_id: sensor.projector_volume
      action: homeassistant.update_entity
    - variables:
        current_volume: '{{ states(''sensor.projector_volume'') | int }}'
        volume_to_set: '{{ (brightness | float / 255 * 50) | int }}'
    - if:
      - condition: template
        value_template: '{{ current_volume >  volume_to_set }}'
      then:
      - variables:
          volume_difference: '{{ current_volume - volume_to_set }}'
      - repeat:
          count: '{{ volume_difference }}'
          sequence:
          - data: {}
            action: shell_command.projector_volumedown
    - if:
      - condition: template
        value_template: '{{ current_volume < volume_to_set }}'
      then:
      - variables:
          volume_difference: '{{ volume_to_set - current_volume }}'
      - repeat:
          count: '{{ volume_difference }}'
          sequence:
          - data: {}
            action: shell_command.projector_volumeup
    - data:
        entity_id:
        - sensor.projector_volume
      target:
        entity_id: sensor.projector_volume
      action: homeassistant.update_entity
  mode: single
