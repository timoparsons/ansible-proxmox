entertainment_shutdown_all:
  alias: Entertainment – Shutdown ALL
  sequence:
  - metadata: {}
    data:
      skip_condition: true
    target:
      entity_id: automation.entertainment_lamp_red_timer_start
    action: automation.trigger
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.appletv
        state: standby
    then:
    - data: {}
      action: script.entertainment_close_all_apps
    - data:
        delay_secs: 2
        hold_secs: 1
        command:
        - home_hold
        - select
      target:
        entity_id: remote.appletv
      action: remote.send_command
    - data: {}
      target:
        entity_id: media_player.appletv
      action: media_player.turn_off
    enabled: true
  - if:
    - condition: not
      conditions:
      - condition: state
        entity_id: media_player.playstation_4
        state: standby
    then:
    - data: {}
      target:
        entity_id: media_player.playstation_4
      action: media_player.media_stop
    - data: {}
      target:
        entity_id: media_player.playstation_4
      action: media_player.turn_off
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - data: {}
    action: shell_command.projector_off
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - data: {}
    action: shell_command.projector_off
  mode: single
  icon: mdi:television
entertainment_playstation_power_toggle:
  alias: Entertainment - Playstation Power TOGGLE
  sequence:
  - if:
    - condition: state
      state: standby
      entity_id: media_player.playstation_4
    then:
    - service: media_player.turn_on
      data: {}
      target:
        entity_id: media_player.playstation_4
    - service: light.turn_on
      data:
        brightness: 255
        effect: rainbow
      target:
        entity_id: light.tv_room_lights
      enabled: false
    else:
    - service: media_player.turn_off
      data: {}
      target:
        entity_id: media_player.playstation_4
  mode: single
entertainment_appletv_power_toggle:
  alias: Entertainment - AppleTV Power TOGGLE
  sequence:
  - if:
    - condition: state
      entity_id: media_player.appletv
      state: standby
    then:
    - service: media_player.turn_on
      data: {}
      target:
        entity_id: media_player.appletv
    - service: light.turn_on
      data:
        brightness: 255
        effect: rainbow
      target:
        entity_id: light.tv_room_lights
      enabled: false
    else:
    - service: script.entertainment_close_all_apps
      data: {}
    - service: remote.send_command
      data:
        delay_secs: 1
        command:
        - home_hold
        - select
      target:
        entity_id: remote.appletv
    - service: media_player.turn_off
      data: {}
      target:
        entity_id: media_player.appletv
  mode: single
entertainment_close_all_apps:
  alias: Entertainment – AppleTV – Close all Apps
  sequence:
  - service: remote.send_command
    data:
      num_repeats: 1
      command:
      - home
    target:
      entity_id: remote.appletv
  - service: remote.send_command
    data:
      num_repeats: 2
      command:
      - home
      delay_secs: 0.2
    target:
      entity_id: remote.appletv
  - delay:
      hours: 0
      minutes: 0
      seconds: 0
      milliseconds: 500
  - service: remote.send_command
    data:
      num_repeats: 1
      command:
      - left
    target:
      entity_id: remote.appletv
  - repeat:
      count: '4'
      sequence:
      - service: remote.send_command
        data:
          num_repeats: 2
          command:
          - up
          delay_secs: 0.2
        target:
          entity_id: remote.appletv
      - delay:
          hours: 0
          minutes: 0
          seconds: 0
          milliseconds: 600
  - service: remote.send_command
    data:
      num_repeats: 1
      command:
      - home
    target:
      entity_id: remote.appletv
  mode: single
projector_volume_up:
  alias: Entertainment – Projector – Volume UP
  sequence:
