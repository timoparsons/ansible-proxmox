play_spotify_playlist_on_sonos:
  alias: Entertainment – Play Playlist on Sonos
  sequence:
  - variables:
      selected_playlist: '{{ states(''input_select.entertainment_playlist_select'')
        }}'
      selected_player: "{% set player_map = {\n  'Lounge': 'media_player.lounge',\n
        \ 'Office': 'media_player.master_bedroom',\n  'TV Room': 'media_player.tv_room',\n
        \ 'Workshop': 'media_player.celeste'\n} %} {{ player_map[states('input_select.entertainment_mediaplayer_select')]
        }}\n"
      playlist_map:
        Music Library:
          type: favorite
          uri: Music Library
        Electronic:
          type: genre
          genres:
          - A:GENRE/Electronic/
          - A:GENRE/Electronic - Beats/
          - A:GENRE/Electronic - Downbeat/
          - A:GENRE/Electronic - Drum & Ba/
          - A:GENRE/Electronic - Pop/
          - A:GENRE/Electronic - Techno Ho/
        Good Times:
          type: playlist
          uri: spotify:playlist:0vHOW0qZ03lBDpWsB8UG37
        Swag:
          type: playlist
          uri: spotify:playlist:3awB0LnP4D1miO1alvuMSf
        Dirty:
          type: playlist
          uri: spotify:playlist:3h4zrNvoE1guitLynsvOAV
        Smooth:
          type: playlist
          uri: spotify:playlist:5EbYfyhaIdUwGCl5oKyWDq
        Smoulder:
          type: playlist
          uri: spotify:playlist:2RfqqwrLPMQvouyxVBSW13
        Tech:
          type: playlist
          uri: spotify:playlist:5ewADDUacBoCKNKjlAMjpE
  - target:
      entity_id: '{{ selected_player }}'
    data:
      shuffle: true
    action: media_player.shuffle_set
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ playlist_map[selected_playlist].type == ''favorite'' }}'
      sequence:
      - target:
          entity_id: '{{ selected_player }}'
        data:
          source: '{{ playlist_map[selected_playlist].uri }}'
        action: media_player.select_source
    - conditions:
      - condition: template
        value_template: '{{ playlist_map[selected_playlist].type == ''genre'' }}'
      sequence:
      - target:
          entity_id: '{{ selected_player }}'
        data:
          media_content_type: genre
          media_content_id: '{{ playlist_map[selected_playlist].genres[0] }}'
          enqueue: replace
        action: media_player.play_media
      - repeat:
          for_each: '{{ playlist_map[selected_playlist].genres[1:] }}'
          sequence:
          - target:
              entity_id: '{{ selected_player }}'
            data:
              media_content_type: genre
              media_content_id: '{{ repeat.item }}'
              enqueue: add
            action: media_player.play_media
    - conditions:
      - condition: template
        value_template: '{{ playlist_map[selected_playlist].type == ''playlist'' }}'
      sequence:
      - target:
          entity_id: '{{ selected_player }}'
        data:
          media_content_type: playlist
          media_content_id: '{{ playlist_map[selected_playlist].uri }}'
          enqueue: replace
        action: media_player.play_media
  - target:
      entity_id: '{{ selected_player }}'
    data:
      media_content_type: '{{ playlist_map[selected_playlist].type }}'
      media_content_id: '{{ playlist_map[selected_playlist].uri }}'
      enqueue: replace
    action: media_player.play_media
  - target:
      entity_id: '{{ selected_player }}'
    action: media_player.media_play
    data: {}
backend_toggle_lxc_container:
  alias: Backend – Toggle LXC Container
  description: 'Toggle LXC container by name: start if off, stop if on.'
  fields:
    lxc_name:
      description: The name part of the LXC entities, e.g., jellyfin_143
      example: jellyfin_143
      required: true
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(''binary_sensor.lxc_'' ~ lxc_name ~ ''_status'',
          ''on'') }}

          '
      sequence:
      - target:
          entity_id: 'button.lxc_{{ lxc_name }}_shutdown

            '
        action: button.press
    - conditions:
      - condition: template
        value_template: '{{ is_state(''binary_sensor.lxc_'' ~ lxc_name ~ ''_status'',
          ''off'') }}

          '
      sequence:
      - target:
          entity_id: 'button.lxc_{{ lxc_name }}_start

            '
        action: button.press
backend_restart_lxc_container:
  sequence:
  - target:
