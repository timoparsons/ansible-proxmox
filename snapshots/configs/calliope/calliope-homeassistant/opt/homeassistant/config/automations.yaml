- id: '1763459524192'
  alias: 'Master Bedroom – Timer FINISH, Lamp OFF: Turn OFF'
  description: 'Per lamp (Tim and Sonya): when that lamp''s timer finishes, turn the
    lamp off. When the lamp is turned off any other way, cancel its timer. Uses the
    timer.finished event (not active->idle) so that cancelling a timer, e.g. from
    the bedside controller, does NOT turn the lamp off. Parallel mode so both lamps
    can time out at the same moment.'
  triggers:
  - entity_id:
    - light.bedside_tim
    from: 'on'
    id: tim_lamp_off
    to: 'off'
    trigger: state
  - event_data:
      entity_id: timer.bedroom_lamp_tim
    event_type: timer.finished
    id: tim_timer_finished
    trigger: event
  - entity_id:
    - light.bedside_sonya
    from: 'on'
    id: sonya_lamp_off
    to: 'off'
    trigger: state
  - event_data:
      entity_id: timer.bedroom_lamp_sonya
    event_type: timer.finished
    id: sonya_timer_finished
    trigger: event
  conditions: []
  actions:
  - choose:
    - alias: 'Tim: turn lamp off, cancel timer'
      conditions:
      - condition: trigger
        id:
        - tim_lamp_off
        - tim_timer_finished
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedside_tim
      - action: timer.cancel
        target:
          entity_id: timer.bedroom_lamp_tim
    - alias: 'Sonya: turn lamp off, cancel timer'
      conditions:
      - condition: trigger
        id:
        - sonya_lamp_off
        - sonya_timer_finished
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedside_sonya
      - action: timer.cancel
        target:
          entity_id: timer.bedroom_lamp_sonya
  mode: parallel
