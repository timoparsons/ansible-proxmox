- id: '1704515078564'
  alias: Irrigation - Morning Irrigation Sequence OLD Nov 2025
  description: Sequential irrigation of all zones starting one hour before sunrise
  triggers:
  - event: sunrise
    offset: -01:00:00
    trigger: sun
  conditions: []
  actions:
  - if:
    - condition: numeric_state
      entity_id: counter.irrigation_daysuntilnext_dripzone
      below: 1
    then:
    - if:
      - condition: template
        value_template: "{{\n  (states('sensor.fineoffset_wh51_0de4e5_moisture') not
          in ['unavailable', 'unknown'] and\n  states('sensor.fineoffset_wh51_0de4e5_moisture')
          | float <\n  states('input_number.irrigation_moisturetrigger_dripzone')
          | float) or\n  (not is_state('input_boolean.irrigation_moisturetrigger_enable_dripzone',
          'on'))\n}}"
      - condition: state
        entity_id: input_boolean.irrigation_enable_dripzone
        state: 'on'
      then:
      - data:
          title: Irrigation
          message: Irrigating Drip Zone for {{ states('sensor.irrigation_adjustedduration_dripzone')
            | round }} mins
          target: tim-iphone
        action: notify.pushover_tim
      - target:
          entity_id: timer.irrigation_timer_dripzone
        data:
          duration: '{{ (states(''sensor.irrigation_adjustedduration_dripzone'') |
            float * 60) | round }}'
        action: timer.start
      - target:
          entity_id: switch.watervalve_dripzone_state
        action: switch.turn_on
        data: {}
      - wait_for_trigger:
        - entity_id: timer.irrigation_timer_dripzone
          from: active
          to: idle
          trigger: state
    - target:
        entity_id: counter.irrigation_daysuntilnext_dripzone
      data:
        value: '{{ states(''input_number.irrigation_frequency_dripzone'') | int }}'
      action: counter.set_value
    - target:
        entity_id: input_datetime.irrigation_last_dripzone
      data:
        datetime: '{{ now().isoformat() }}'
      action: input_datetime.set_datetime
    enabled: false
  - if:
    - condition: numeric_state
