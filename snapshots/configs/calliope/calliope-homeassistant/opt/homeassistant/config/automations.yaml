      state: home
    - condition: state
      entity_id: person.sonya
      state: home
    - condition: state
      entity_id: person.celeste
      state: home
  - condition: state
    entity_id: timer.entrance_debounce_timer
    state: idle
  - condition: state
    entity_id: binary_sensor.crow_alarm_doors_front_door
    state: 'off'
  actions:
  - action: shell_command.sonos_doorbell
    data: {}
    enabled: true
    metadata: {}
  - action: shell_command.sonos_doorbell_dingdong
    data: {}
    enabled: false
    metadata: {}
  mode: single
- id: '1673380014833'
  alias: Security – Parking space alert
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - input_boolean.car_street_occupancy_debounce
    to: 'off'
    enabled: true
  conditions:
  - condition: state
    entity_id: input_boolean.parking_space_alert
    state: 'on'
    enabled: true
  actions:
  - data:
      url: http://10.1.1.28:5000/api/Front/latest.jpg
      filename: front_yard.jpg
      overwrite: true
    action: downloader.download_file
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - data:
      title: Parking
      message: Your parking space is free
      data:
        attachment: /config/www/cameras/front_yard.jpg
        priority: 2
        retry: 60
        expire: 3600
      target: tim-iphone
    action: notify.pushover_tim
  - data: {}
    target:
      entity_id: input_boolean.parking_space_alert
    action: input_boolean.turn_off
  - action: shell_command.sonos_custom
    data:
      volume: 60
      sound: parking_alert_voice.mp3
      speaker: Office
    enabled: false
  mode: single
- id: '1674338058100'
  alias: Security – Door Chime SILENCE for 1hr
  description: ''
  trigger:
  - platform: state
    entity_id:
    - input_boolean.silence_doorbell
    to: 'on'
  condition: []
