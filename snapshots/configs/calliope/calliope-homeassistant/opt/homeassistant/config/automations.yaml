- id: '1751152560728'
  alias: 'Power Outage – Power OFF 2min: Shutdown LXCs'
  description: After 2 minutes of power outage, shutdown multiple Proxmox LXCs to
    conserve UPS battery.
  triggers:
  - entity_id: input_boolean.ups_power_outage
    to: 'on'
    for:
      minutes: '{{ shutdown_delay_minutes }}'
    trigger: state
  - entity_id:
    - input_boolean.ups_power_outage
    to: 'on'
    from: 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
    trigger: state
  conditions:
  - condition: state
    entity_id: sensor.calliope_ups_status_data
    state:
    - OB DISCHRG
    - OB
    - FSD OB DISCHRG
  actions:
  - variables:
      running_lxcs: []
      stopped_lxcs: []
  - repeat:
      for_each: '{{ lxcs_to_shutdown }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''on'') }}'
        then:
        - variables:
            running_lxcs: '{{ running_lxcs + [repeat.item.friendly_name] }}'
        else:
        - variables:
            stopped_lxcs: '{{ stopped_lxcs + [repeat.item.friendly_name] }}'
  - action: input_text.set_value
    metadata: {}
    data:
      value: 'Power still out after {{ shutdown_delay_minutes }} minutes.

        {% if running_lxcs | length > 0 %}Shutting down: {{ running_lxcs | join('',
        '') }} {% endif %}

        {% if stopped_lxcs | length > 0 %}Already stopped: {{ stopped_lxcs | join('',
        '') }} {% endif %}

        {% if running_lxcs | length == 0 and stopped_lxcs | length == 0 %} No LXCs
        found to check. {% endif %}'
    target:
      entity_id: input_text.ups_last_event
  - action: rest_command.ups_beeper_disable
    metadata: {}
    data: {}
    enabled: true
  - repeat:
      for_each: '{{ lxcs_to_shutdown }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''on'') }}'
        then:
        - action: button.press
          metadata: {}
          data: {}
          target:
            entity_id: '{{ repeat.item.entity_id }}'
        - action: input_boolean.turn_on
          metadata: {}
          data: {}
          target:
            entity_id: input_boolean.{{ repeat.item.name }}_shutdown_by_ups
        - delay:
            seconds: 5
    enabled: true
  - action: notify.pushover_servers
    continue_on_error: true
    metadata: {}
    data:
      target: tim-iphone,mac-studio
      title: Calliope Power Outage
      message: 'Power still out after {{ shutdown_delay_minutes }} minutes.

        {% if running_lxcs | length > 0 %}Shutting down: {{ running_lxcs | join('',
        '') }} {% endif %}

        {% if stopped_lxcs | length > 0 %}Already stopped: {{ stopped_lxcs | join('',
        '') }} {% endif %}

        {% if running_lxcs | length == 0 and stopped_lxcs | length == 0 %} No LXCs
        found to check. {% endif %}'
      data:
        priority: 1
    enabled: true
  variables:
    shutdown_delay_minutes: 2
    lxcs_to_shutdown:
    - name: adguard
      friendly_name: Adguard
      entity_id: button.lxc_adguard_123_shutdown
      status_entity: binary_sensor.lxc_frigate_128_status
    - name: frigate
      friendly_name: Frigate
      entity_id: button.lxc_frigate_128_shutdown
      status_entity: binary_sensor.lxc_adguard_123_status
    - name: plex
      friendly_name: Plex
      entity_id: button.lxc_plex_142_shutdown
      status_entity: binary_sensor.lxc_plex_142_status
    - name: immich
      friendly_name: Immich
      entity_id: button.lxc_immich_148_shutdown
      status_entity: binary_sensor.lxc_immich_148_status
  mode: single
