- id: '1676525553432'
  alias: Security – Visitor – Snapshot, Timer & Alert
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.ds_2cd2087g2_lu20210722aawrg35627785_1_linedetection
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    enabled: true
    entity_id: timer.entrance_debounce_timer
    state: idle
  - condition: state
    enabled: true
    entity_id: timer.frontdoor_debounce_timer
    state: idle
  - condition: state
    entity_id: input_boolean.silence_doorbell
    state: 'off'
  - condition: state
    entity_id: binary_sensor.crow_alarm_doors_front_door
    state: 'off'
  actions:
  - action: timer.start
    data:
      duration: 0
    target:
      entity_id: timer.entrance_debounce_timer
  - action: shell_command.camera_snap
    data: {}
    enabled: false
  - action: downloader.download_file
    data:
      filename: front_yard.jpg
      overwrite: true
      url: http://10.1.1.28:5000/api/Front/latest.jpg
  - delay:
      hours: 0
      milliseconds: 500
      minutes: 0
      seconds: 0
  - else:
    - else:
      - action: notify.pushover_household
        data:
          data:
            attachment: /config/www/cameras/front_yard.jpg
            priority: -1
          message: You have a visitor
          title: Security
      if:
      - after: 07:00:00
        before: '23:00:00'
        condition: time
      then:
      - action: notify.pushover_household
        data:
          data:
            attachment: /config/www/cameras/front_yard.jpg
          message: You have a visitor
          title: Security
    if:
    - condition: and
      conditions:
      - condition: state
        entity_id: person.sonya
        state: not_home
      - condition: state
        entity_id: person.tim
        state: not_home
      - condition: state
        entity_id: binary_sensor.crow_alarm_doors_front_door
        state: 'off'
    then:
    - delay:
        hours: 0
        milliseconds: 0
        minutes: 1
        seconds: 20
    - if:
      - condition: state
        entity_id: person.sonya
        state: not_home
      - condition: state
        entity_id: person.tim
        state: not_home
      - condition: state
        entity_id: binary_sensor.crow_alarm_doors_front_door
        state: 'off'
      then:
      - action: notify.pushover_household
        data:
          data:
            attachment: /config/www/cameras/front_yard.jpg
            priority: -1
          message: You had a visitor at home
          title: Security
  - action: shell_command.delete_camera_snap
    data: {}
    enabled: true
  mode: single
