- id: '1730786066468'
  alias: 'Office – Presence AWAY: Switch Gear OFF'
  description: Turns off office equipment when away. Uses extended timeout (90 min)
    during business hours Mon–Fri 7am–6pm, 10 min otherwise. Skipped entirely if Edit
    Suite Power Override is ON.
  triggers:
  - entity_id:
    - sensor.espresence_tim_iphone
    for:
      hours: 0
      minutes: '{{ 90 if (now().weekday() < 5 and 7 <= now().hour < 18) else 10 }}'
      seconds: 0
    from: office
    id: presence_timeout
    to: not_home
    trigger: state
  - at: '21:00:00'
    id: evening_shutdown
    trigger: time
  - entity_id:
    - light.lightbulb_office
    for:
      hours: 3
      minutes: 0
      seconds: 0
    id: equipment_timeout
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: input_boolean.edit_suite_power_override
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: light.lightbulb_office
      state: 'on'
    - condition: state
      entity_id: switch.smartplug_wemo_editsuite
      state: 'on'
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.espresence_tim_iphone
          state: office
      - condition: template
        value_template: '{{ trigger.id in [''presence_timeout'', ''evening_shutdown'']
          }}'
    - condition: and
      conditions:
      - condition: template
        value_template: '{{ trigger.id == ''equipment_timeout'' }}'
      - condition: not
        conditions:
        - condition: state
          entity_id: sensor.espresence_tim_iphone
          state: office
  actions:
  - action: logbook.log
    data:
      message: 'Equipment shutdown triggered by: {{ trigger.id }}{% if trigger.id
        == ''presence_timeout'' %} ({{ ''Business hours – 90 min timeout'' if (now().weekday()
        < 5 and 7 <= now().hour < 18) else ''After hours – 10 min timeout'' }}){%
        endif %}'
      name: Office Automation
  - action: switch.turn_off
    continue_on_error: true
    data: {}
    enabled: true
    target:
      entity_id: switch.smartplug_wemo_editsuite
  - action: light.turn_off
    continue_on_error: true
    data: {}
    target:
      device_id: 260a8dc6f1811191979aa2b2bed0a363
  - action: notify.pushover_tim
    data:
      message: Equipment turned off – {{ trigger.id }}{% if trigger.id == 'presence_timeout'
        %} after {{ 90 if (now().weekday() < 5 and 7 <= now().hour < 18) else 10 }}
        min away{% elif trigger.id == 'evening_shutdown' %} evening shutdown{% elif
        trigger.id == 'equipment_timeout' %} light left on for 3+ hours{% endif %}
      priority: '{{ 0 if trigger.id == ''evening_shutdown'' else -1 }}'
      target: tim-iphone
      title: Away from Office
  mode: single
