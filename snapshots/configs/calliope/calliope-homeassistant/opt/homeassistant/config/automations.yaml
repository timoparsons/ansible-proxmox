- id: downstairs_hallway_master_lighting_control
  alias: Downstairs – Hallway – Motion Lighting
  description: Consolidates motion-on, timer-off, and time-off logic into a single
    automation.
  triggers:
  - entity_id:
    - binary_sensor.crow_alarm_sensors_downstairs_hallway
    - binary_sensor.crow_alarm_doors_back_door
    - binary_sensor.motion_stairwell_occupancy
    id: motion_detected
    platform: state
    to: 'on'
  - event_type: timer.finished
    id: timer_finished
    platform: event
    event_data:
      entity_id: timer.downstairs_hallway_lights_timer
  - id: turn_off_at_10pm
    at: '22:00:00'
    platform: time
  actions:
  - choose:
    - sequence:
      - target:
          entity_id: switch.downstairs_hallway_switch_0
        action: switch.turn_on
      - REDACTED
        - data:
            duration: 00:00:30
          target:
            entity_id: timer.downstairs_hallway_lights_timer
          action: timer.start
        choose:
        - sequence:
          - target:
              entity_id: timer.downstairs_hallway_lights_timer
            action: timer.start
            data:
              duration: 00:00:20
          conditions:
          - state: playing
            condition: state
            entity_id: media_player.playstation_4
      conditions:
      - id: motion_detected
        condition: trigger
      - state: 'off'
        condition: state
        entity_id: input_boolean.silence_doorbell
      - entity_id: input_boolean.downstairs_hallway_manual_mode
        condition: state
        state: 'off'
      - condition: or
        conditions:
        - before: sunrise
          condition: sun
          before_offset: 01:00:00
          after: sunset
          after_offset: -01:00:00
        - entity_id: sensor.lux_office_illuminance_lux
          below: 200
          condition: numeric_state
    - sequence:
      - target:
          entity_id: switch.downstairs_hallway_switch_0
        action: switch.turn_off
      conditions:
      - condition: trigger
        id: timer_finished
    - conditions:
      - condition: trigger
        id: turn_off_at_10pm
      sequence:
      - target:
          entity_id: switch.downstairs_hallway_switch_0
        action: switch.turn_off
  mode: restart
