          data:
            value: '{{ states(''input_number.irrigation_frequency_sprayzone'') | int
              }}'
          action: counter.set_value
  - if:
    - condition: numeric_state
      entity_id: counter.irrigation_daysuntilnext_dripzone
      below: 1
    - condition: state
      entity_id: input_select.irrigation_mode_dripzone
      state: Morning
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enable_dripzone
          state: 'on'
        - condition: or
          conditions:
          - condition: state
            entity_id: input_boolean.irrigation_moisturetrigger_enable_dripzone
            state: 'off'
          - condition: template
            value_template: "{{ \n  states('sensor.fineoffset_wh51_0de4e5_moisture')
              not in ['unavailable', 'unknown'] \n  and states('sensor.fineoffset_wh51_0de4e5_moisture')
              | float < states('input_number.irrigation_moisturetrigger_dripzone')
              | float \n}}"
        sequence:
        - data:
            title: Irrigation
            message: Irrigating Drip Zone for {{ states('sensor.irrigation_adjustedduration_dripzone')
              | round }} mins
            target: tim-iphone
          action: notify.pushover_tim
        - target:
            entity_id: timer.irrigation_timer_dripzone
          data:
            duration: '{{ (states(''sensor.irrigation_adjustedduration_dripzone'')
              | float * 60) | round }}'
          action: timer.start
        - target:
            entity_id:
            - switch.watervalve_dripzone_state
          action: switch.turn_on
          data: {}
        - wait_for_trigger:
          - entity_id:
            - timer.irrigation_timer_dripzone
            from: active
            to: idle
            trigger: state
        - target:
            entity_id: counter.irrigation_daysuntilnext_dripzone
          data:
            value: '{{ states(''input_number.irrigation_frequency_dripzone'') | int
              }}'
          action: counter.set_value
        - target:
            entity_id: input_datetime.irrigation_last_dripzone
          data:
            datetime: '{{ now().isoformat() }}'
          action: input_datetime.set_datetime
      - conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enable_dripzone
          state: 'on'
        - condition: state
          entity_id: input_boolean.irrigation_moisturetrigger_enable_dripzone
          state: 'on'
        - condition: template
          value_template: "{{ \n  states('sensor.fineoffset_wh51_0de4e5_moisture')
            not in ['unavailable', 'unknown'] \n  and states('sensor.fineoffset_wh51_0de4e5_moisture')
            | float >= states('input_number.irrigation_moisturetrigger_dripzone')
            | float \n}}"
        sequence:
        - data:
            title: "Irrigation Skipped \U0001F4A7"
            message: Drip irrigation skipped. Moisture level ({{ states('sensor.fineoffset_wh51_0de4e5_moisture')
              }}%)  is above the threshold of {{ states('input_number.irrigation_moisturetrigger_dripzone')
              }}%. **Will try again today.**
            target: tim-iphone
          action: notify.pushover_tim
      REDACTED
        sequence:
        - target:
            entity_id: counter.irrigation_daysuntilnext_dripzone
          data:
            value: '{{ states(''input_number.irrigation_frequency_dripzone'') | int
              }}'
          action: counter.set_value
  - if:
    - condition: numeric_state
      entity_id: counter.irrigation_daysuntilnext_lawnzone
      below: 1
    - condition: state
      entity_id: input_select.irrigation_mode_lawnzone
      state: Morning
    then:
    - choose:
      - conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enable_lawnzone
          state: 'on'
        - condition: or
          conditions:
          - condition: state
            entity_id: input_boolean.irrigation_moisturetrigger_enable_lawnzone
            state: 'off'
          - condition: template
            value_template: "{{ \n  states('sensor.fineoffset_wh51_0de4e5_moisture')
              not in ['unavailable', 'unknown'] \n  and states('sensor.fineoffset_wh51_0de4e5_moisture')
              | float < states('input_number.irrigation_moisturetrigger_lawnzone')
              | float \n}}"
        sequence:
        - data:
            title: Irrigation
            message: Irrigating Lawn Zone for {{ states('sensor.irrigation_adjustedduration_lawnzone')
              | round }} mins
            target: tim-iphone
          action: notify.pushover_tim
        - target:
            entity_id: timer.irrigation_timer_lawnzone
          data:
            duration: '{{ (states(''sensor.irrigation_adjustedduration_lawnzone'')
              | float * 60) | round }}'
          action: timer.start
        - target:
            entity_id:
            - switch.watervalve_lawnzone_state
          action: switch.turn_on
          data: {}
        - wait_for_trigger:
          - entity_id:
            - timer.irrigation_timer_lawnzone
            from: active
            to: idle
            trigger: state
        - target:
            entity_id: counter.irrigation_daysuntilnext_lawnzone
          data:
            value: '{{ states(''input_number.irrigation_frequency_lawnzone'') | int
              }}'
          action: counter.set_value
        - target:
            entity_id: input_datetime.irrigation_last_lawnzone
          data:
            datetime: '{{ now().isoformat() }}'
          action: input_datetime.set_datetime
      - conditions:
        - condition: state
          entity_id: input_boolean.irrigation_enable_lawnzone
          state: 'on'
        - condition: state
          entity_id: input_boolean.irrigation_moisturetrigger_enable_lawnzone
          state: 'on'
        - condition: template
          value_template: "{{ \n  states('sensor.fineoffset_wh51_0de4e5_moisture')
            not in ['unavailable', 'unknown'] \n  and states('sensor.fineoffset_wh51_0de4e5_moisture')
            | float >= states('input_number.irrigation_moisturetrigger_lawnzone')
            | float \n}}"
        sequence:
        - data:
            title: "Irrigation Skipped \U0001F4A7"
            message: Lawn irrigation skipped. Moisture level ({{ states('sensor.fineoffset_wh51_0de4e5_moisture')
              }}%)  is above the threshold of {{ states('input_number.irrigation_moisturetrigger_lawnzone')
              }}%. **Will try again today.**
            target: tim-iphone
          action: notify.pushover_tim
      REDACTED
        sequence:
        - target:
            entity_id: counter.irrigation_daysuntilnext_lawnzone
          data:
            value: '{{ states(''input_number.irrigation_frequency_lawnzone'') | int
              }}'
          action: counter.set_value
    enabled: true
  mode: single
