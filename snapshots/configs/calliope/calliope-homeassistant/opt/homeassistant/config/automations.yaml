  variables:
    camera: '{{ trigger.payload_json[''after''][''camera''] }}'
    camera_name: '{{ camera | replace(''_'', '' '') | title }}'
    review_id: '{{ trigger.payload_json[''after''][''id''] }}'
    objects: '{{ trigger.payload_json[''after''][''data''][''objects''] }}'
    severity: '{{ trigger.payload_json[''after''][''severity''] }}'
    base_url: https://homeassistant.timparsons.nz:8443
    client_id: ''
    thumbnail_url: '{{ base_url }}/api/frigate{{ client_id }}/notifications/{{ trigger.payload_json[''after''][''data''][''detections''][0]
      }}/thumbnail.jpg'
    clip_url: '{{ base_url }}/api/frigate{{ client_id }}/notifications/{{ trigger.payload_json[''after''][''data''][''detections''][0]
      }}/{{ camera }}/clip.mp4'
    snapshot_url: '{{ base_url }}/api/frigate{{ client_id }}/notifications/{{ trigger.payload_json[''after''][''data''][''detections''][0]
      }}/snapshot.jpg'
    title: Security Alert
