- id: '1716708582622'
  alias: 'Master Bedroom – Motion: Lamp ON'
  description: 'Motion in the hallway or master bedroom. Tim''s and Sonya''s bedside
    lamps are handled independently, each with its own timer (timer.bedroom_lamp_tim,
    timer.bedroom_lamp_sonya). For each lamp: if it is off (after sunset-30min, before
    22:50, Tim''s iPhone not charging and no Focus): turn it on (Adaptive Lighting
    sets brightness/colour) and start its 3-minute timer. If it is on AND its timer
    is active (turned on by this automation): restart its timer so it stays on while
    there is movement. If it was turned on manually (timer idle): do nothing.'
  triggers:
  - entity_id:
    - binary_sensor.crow_alarm_sensors_front_hallway
    - binary_sensor.crow_alarm_sensors_master_bedroom
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: 'Tim lamp on via motion: restart timer'
      conditions:
      - condition: state
        entity_id: light.bedside_tim
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_tim
        state: active
      sequence:
      - action: timer.start
        data:
          duration: 00:03:00
        target:
          entity_id: timer.bedroom_lamp_tim
    - alias: 'Tim lamp off: turn on and start timer'
      conditions:
      - condition: state
        entity_id: light.bedside_tim
        state: 'off'
      - condition: state
        entity_id: sensor.tims_iphone_battery_state
        state: Not Charging
      - after: sunset
        after_offset:
          hours: 0
          minutes: 0
          seconds: 0
        condition: sun
      - before: '22:00:00'
        condition: time
      - condition: state
        entity_id: binary_sensor.tims_iphone_focus
        state: 'off'
      sequence:
      - action: light.turn_on
        data: {}
        target:
          entity_id: light.bedside_tim
      - action: timer.start
        data:
          duration: 00:03:00
        target:
          entity_id: timer.bedroom_lamp_tim
  - choose:
    - alias: 'Sonya lamp on via motion: restart timer'
      conditions:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_sonya
        state: active
      sequence:
      - action: timer.start
        data:
          duration: 00:03:00
        target:
          entity_id: timer.bedroom_lamp_sonya
    - alias: 'Sonya lamp off: turn on and start timer'
      conditions:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'off'
      - after: sunset
        after_offset:
          hours: 0
          minutes: 0
          seconds: 0
        condition: sun
      - before: '22:00:00'
        condition: time
      - condition: state
        entity_id: sensor.tims_iphone_battery_state
        state: Not Charging
      - condition: state
        entity_id: binary_sensor.tims_iphone_focus
        state: 'off'
      sequence:
      - action: light.turn_on
        data: {}
        target:
          entity_id: light.bedside_sonya
      - action: timer.start
        data:
          duration: 00:03:00
        target:
          entity_id: timer.bedroom_lamp_sonya
  mode: restart
