- id: '1736029765964'
  alias: Irrigation - Evening Irrigation Sequence OLD Nov 2025
  description: Sequential irrigation of all zones starting one hour before sunset
  triggers:
  - event: sunset
    offset: -01:00:00
    trigger: sun
  conditions: []
  actions:
  - if:
    - condition: numeric_state
      entity_id: counter.irrigation_daysuntilnext_vegezone
      below: 1
    then:
    - if:
      - condition: template
        value_template: "{{\n  (states('sensor.fineoffset_wh51_0de4e5_moisture') not
          in ['unavailable', 'unknown'] and\n  states('sensor.fineoffset_wh51_0de4e5_moisture')
          | float <\n  states('input_number.irrigation_moisturetrigger_vegezone')
          | float) or\n  (not is_state('input_boolean.irrigation_moisturetrigger_enable_vegezone',
          'on'))\n}}"
      - condition: state
        entity_id: input_boolean.irrigation_enable_vegezone
        state: 'on'
      then:
      - data:
          title: Irrigation
          message: Irrigating Vege Zone for {{ states('sensor.irrigation_adjustedduration_vegezone')
            | round }} mins
          target: tim-iphone
        action: notify.pushover_tim
      - target:
          entity_id: timer.irrigation_timer_vegezone
        data:
          duration: '{{ (states(''sensor.irrigation_adjustedduration_vegezone'') |
            float * 60) | round }}'
        action: timer.start
      - target:
          entity_id:
          - switch.watervalve_vegezone_state
        action: switch.turn_on
        data: {}
      - wait_for_trigger:
        - entity_id:
          - timer.irrigation_timer_vegezone
          from: active
          to: idle
          trigger: state
    - target:
        entity_id: counter.irrigation_daysuntilnext_vegezone
      data:
        value: '{{ states(''input_number.irrigation_frequency_vegezone'') | int }}'
      action: counter.set_value
    - target:
        entity_id: input_datetime.irrigation_last_vegezone
      data:
        datetime: '{{ now().isoformat() }}'
      action: input_datetime.set_datetime
    enabled: true
  mode: single
