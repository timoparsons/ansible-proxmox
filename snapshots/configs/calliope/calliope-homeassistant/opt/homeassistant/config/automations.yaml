        state: 'on'
      then:
      - data:
          title: Irrigation
          message: Irrigating Spray Zone for {{ states('sensor.irrigation_adjustedduration_sprayzone')
            | round }} mins
          target: tim-iphone
        action: notify.pushover_tim
      - target:
          entity_id: timer.irrigation_timer_sprayzone
        data:
          duration: '{{ (states(''sensor.irrigation_adjustedduration_sprayzone'')
            | float * 60) | round }}'
        action: timer.start
