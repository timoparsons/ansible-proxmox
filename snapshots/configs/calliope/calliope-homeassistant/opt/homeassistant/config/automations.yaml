- id: '1791261015217'
  alias: IKEA Bilresa - High-Performance Wheel Control (SLZB Custom Topic)
  description: 'Bedside controller for light.bedside_tim. The button alternates on/off
    payloads on its own, so both are treated as one press acting on the real lamp
    state: lamp on with timer.bedroom_lamp_tim running (motion-started) -> cancel
    timer, lamp flashes twice to confirm and stays on; lamp off -> on; lamp on with
    no timer -> off. Wheel steps brightness 10% on each bedside lamp that is on (Tim''s
    and Sonya''s); if both are off it steps Tim''s lamp only. DOUBLE press (action
    on_double/off_double) -> toggle BOTH bedside lamps via script.master_bedroom_bedside_lamps_toggle_both.'
  triggers:
  - topic: zigbee2mqtt_slzb/controller_ikea_bedside1
    trigger: mqtt
  actions:
  - variables:
      payload: '{{ trigger.payload_json }}'
  - variables:
      action_val: '{{ payload.action if ''action'' in payload else '''' }}'
      has_level: '{{ payload.action_level is defined and payload.action_level is not
        none }}'
  - choose:
    - alias: 'Double press: toggle both lamps'
      conditions:
      - condition: template
        value_template: '{{ action_val in [''on_double'', ''off_double''] }}'
      sequence:
      - action: script.master_bedroom_bedside_lamps_toggle_both
    - alias: 'Button, lamp on via motion: cancel timer, keep on'
      conditions:
      - condition: template
        value_template: '{{ action_val in [''on'', ''off''] }}'
      - condition: state
        entity_id: light.bedside_tim
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_tim
        state: active
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.bedroom_lamp_tim
      - action: light.turn_on
        alias: Flash lamp twice to confirm timer cancelled
        data:
          effect: okay
        target:
          entity_id: light.bedside_tim
    - alias: 'Button, lamp off: turn on'
      conditions:
      - condition: template
        value_template: '{{ action_val in [''on'', ''off''] }}'
      - condition: state
        entity_id: light.bedside_tim
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedside_tim
    - alias: 'Button, lamp on (manual): turn off'
      conditions:
      - condition: template
        value_template: '{{ action_val in [''on'', ''off''] }}'
      - condition: state
        entity_id: light.bedside_tim
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedside_tim
    - conditions:
      - condition: template
        value_template: '{{ action_val == ''brightness_move_to_level'' or has_level
          }}'
      sequence:
      - variables:
          level: '{{ payload.action_level | int(128) }}'
      - variables:
          is_up: '{{ level > 128 or payload.action_brightness_delta | default(0) >
            0 }}'
      - variables:
          wheel_targets: '{% set on = [''light.bedside_tim'', ''light.bedside_sonya'']
            | select(''is_state'', ''on'') | list %}{{ on if on else [''light.bedside_tim'']
            }}'
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ is_up }}'
          sequence:
          - action: light.turn_on
            data:
              brightness_step_pct: 10
              transition: 0.1
            target:
              entity_id: '{{ wheel_targets }}'
        - conditions:
          - condition: template
            value_template: '{{ not is_up }}'
          sequence:
          - action: light.turn_on
            data:
              brightness_step_pct: -10
              transition: 0.1
            target:
              entity_id: '{{ wheel_targets }}'
  - delay:
      milliseconds: 30
  mode: restart
- id: '1791268308278'
  alias: 'Master Bedroom – Phone CHARGING after 2200: SLEEP Mode ON'
  description: When Tim's iPhone starts charging between 22:00 and 05:00, turn on
    Adaptive Lighting sleep mode for the master bedroom. Sleep mode is turned off
    again 1 hour before sunrise (same as the Lounge dawn automation).
  triggers:
  - entity_id: sensor.tims_iphone_battery_state
    from: Not Charging
    id: charging
    to:
    - Charging
    - Full
    trigger: state
  - event: sunrise
    id: dawn
    offset: -01:00:00
    trigger: sun
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: charging
      - after: '22:00:00'
        before: 05:00:00
        condition: time
      sequence:
      - action: switch.turn_on
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_master_bedroom
    - conditions:
      - condition: trigger
        id: dawn
      sequence:
      - action: switch.turn_off
        target:
          entity_id: switch.adaptive_lighting_sleep_mode_master_bedroom
  mode: single
- id: '1791768681284'
  alias: 'Master Bedroom – Sonya Bedside Button PRESS: Toggle Lamp'
  description: 'Sonya''s bedside controller (controller_ikea_bedside2, dual button;
    either button does the same). DOUBLE press -> toggle BOTH bedside lamps (script.master_bedroom_bedside_lamps_toggle_both).
    SINGLE press -> acts on Sonya''s lamp state: lamp on with timer.bedroom_lamp_sonya
    running (motion-started) -> cancel timer, lamp dips twice to confirm and stays
    on; lamp off -> on; lamp on with no timer -> off. Long press and long-release
    are ignored. The confirmation is a brightness dip rather than an effect because
    these bulbs expose no effects in Home Assistant, and the lamp never turns off
    during it so the timer-finish automation is not triggered.'
  triggers:
  - entity_id:
    - event.controller_ikea_bedside2a
    - event.controller_ikea_bedside2b
    not_from:
    - unavailable
    not_to:
    - unavailable
    - unknown
    trigger: state
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.event_type in [''multi_press_1'',
      ''multi_press_2''] }}'
  actions:
  - choose:
    - alias: 'Double press: toggle both lamps'
      conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''multi_press_2''
          }}'
      sequence:
      - action: script.master_bedroom_bedside_lamps_toggle_both
    - alias: 'Button, lamp on via motion: cancel timer, keep on, dip twice'
      conditions:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_sonya
        state: active
      sequence:
      - action: timer.cancel
        target:
          entity_id: timer.bedroom_lamp_sonya
      - variables:
          orig_brightness: '{{ state_attr(''light.bedside_sonya'', ''brightness'')
            | int(255) }}'
      - repeat:
          count: 2
          sequence:
          - action: light.turn_on
            data:
              brightness: 1
              transition: 0.15
            target:
              entity_id: light.bedside_sonya
          - delay:
              milliseconds: 400
          - action: light.turn_on
            data:
              brightness: '{{ orig_brightness }}'
              transition: 0.15
            target:
              entity_id: light.bedside_sonya
          - delay:
              milliseconds: 400
    - alias: 'Button, lamp off: turn on'
      conditions:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.bedside_sonya
    - alias: 'Button, lamp on (manual): turn off'
      conditions:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.bedside_sonya
  mode: restart
- id: '1792352004105'
  alias: 'Master Bedroom – No Motion 45min, Lamp ON (manual): Warn and Turn OFF'
  description: 'Auto-off for bedside lamps that were turned on (or kept on) by hand,
    i.e. lamp on with its motion timer (timer.bedroom_lamp_tim / timer.bedroom_lamp_sonya)
    idle. When the master bedroom sensor has seen no motion for 45 minutes, the lamp
    dips twice as a warning; if there is still no motion 1 minute later it turns off.
    Motion during that minute keeps it on for another 45 minutes. Motion-started lamps
    are left to their 3-minute timer. Note: a button press during the warning turns
    the lamp off (normal single-press behaviour for a manually-on lamp).'
  triggers:
  - entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
    for:
      minutes: 45
    to: 'off'
    trigger: state
  - entity_id:
    - light.bedside_tim
    - light.bedside_sonya
    for:
      minutes: 45
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
    for:
      minutes: 45
    state: 'off'
  actions:
  - parallel:
    - alias: 'Tim: warn, then turn off if still no motion'
      sequence:
      - condition: state
        entity_id: light.bedside_tim
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_tim
        state: idle
      - variables:
          orig_brightness: '{{ state_attr(''light.bedside_tim'', ''brightness'') |
            int(255) }}'
      - repeat:
          count: 2
          sequence:
          - action: light.turn_on
            data:
              brightness: 1
              transition: 0.15
            target:
              entity_id: light.bedside_tim
          - delay:
              milliseconds: 400
          - action: light.turn_on
            data:
              brightness: '{{ orig_brightness }}'
              transition: 0.15
            target:
              entity_id: light.bedside_tim
          - delay:
              milliseconds: 400
      - continue_on_timeout: true
        timeout:
          minutes: 1
        wait_for_trigger:
        - entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
          to: 'on'
          trigger: state
      - if:
        - condition: state
          entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
          for:
            minutes: 1
          state: 'off'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedside_tim
    - alias: 'Sonya: warn, then turn off if still no motion'
      sequence:
      - condition: state
        entity_id: light.bedside_sonya
        state: 'on'
      - condition: state
        entity_id: timer.bedroom_lamp_sonya
        state: idle
      - variables:
          orig_brightness: '{{ state_attr(''light.bedside_sonya'', ''brightness'')
            | int(255) }}'
      - repeat:
          count: 2
          sequence:
          - action: light.turn_on
            data:
              brightness: 1
              transition: 0.15
            target:
              entity_id: light.bedside_sonya
          - delay:
              milliseconds: 400
          - action: light.turn_on
            data:
              brightness: '{{ orig_brightness }}'
              transition: 0.15
            target:
              entity_id: light.bedside_sonya
          - delay:
              milliseconds: 400
      - continue_on_timeout: true
        timeout:
          minutes: 1
        wait_for_trigger:
        - entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
          to: 'on'
          trigger: state
      - if:
        - condition: state
          entity_id: binary_sensor.crow_alarm_sensors_master_bedroom
          for:
            minutes: 1
          state: 'off'
        then:
        - action: light.turn_off
          target:
            entity_id: light.bedside_sonya
  mode: single
