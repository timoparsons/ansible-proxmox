- id: '1673328356653'
  alias: Security – Visitor – Door Chime
  description: ''
  triggers:
  - entity_id:
    - binary_sensor.ds_2cd2087g2_lu20210722aawrg35627785_1_linedetection
    to: 'on'
    trigger: state
  conditions:
  - after: sunrise
