      below: 1
    then:
    - if:
      - condition: template
        value_template: "{{\n  (states('sensor.fineoffset_wh51_0de4e5_moisture') not
          in ['unavailable', 'unknown'] and\n  states('sensor.fineoffset_wh51_0de4e5_moisture')
          | float <\n  states('input_number.irrigation_moisturetrigger_sprayzone')
          | float) or\n  (not is_state('input_boolean.irrigation_moisturetrigger_enable_sprayzone',
          'on'))\n}}"
      - condition: state
