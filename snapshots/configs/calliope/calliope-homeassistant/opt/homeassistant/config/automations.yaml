- id: '1751770911298'
  alias: 'Power Outage – Power ON: Wake Synology, Start LXCs, Notification'
  description: When power is restored, wake Synology and start up LXCs that were shutdown
    during the power outage.
  triggers:
  - event: start
    trigger: homeassistant
  - trigger: state
    entity_id: sensor.calliope_ups_status_data
    to:
    - OL
    - OL CHRG
    - FSD OL CHRG
    from:
    - OB DISCHRG
    - OB
    - FSD OB DISCHRG
  conditions:
  - condition: state
    state: 'on'
    entity_id: input_boolean.ups_power_outage
    enabled: true
  actions:
  - action: input_text.set_value
    metadata: {}
    data:
      value: 'Power restored at {{ now().strftime(''%H:%M on %B %d'') }}. Outage duration:
        {% set hours = states(''sensor.ups_last_outage_duration'') | float %} {%-
        if hours >= 1 -%}   {{ (hours | int) }} hour{{ ''s'' if hours | int != 1 else
        '''' }} {{ ((hours % 1) * 60) | round }} minute{{ ''s'' if ((hours % 1) *
        60) | round != 1 else '''' }} {%- else -%}   {{ (hours * 60) | round }} minute{{
        ''s'' if (hours * 60) | round != 1 else '''' }} {%- endif -%} {% if lxcs_to_start
        | length > 0 %}Starting up: {{ lxcs_to_start | join('', '') }}{% endif %}
        {% if lxcs_already_running | length > 0 %}Already running: {{ lxcs_already_running
        | join('', '') }}{% endif %}'
    target:
      entity_id: input_text.ups_last_event
  - action: button.press
    metadata: {}
    data: {}
    target:
      entity_id: button.wake_on_lan_90_09_d0_6a_5f_e4
  - variables:
      lxcs_to_start: []
      lxcs_already_running: []
  - repeat:
      for_each: '{{ lxcs_to_startup }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''off'') }}'
        then:
        - variables:
            lxcs_to_start: '{{ lxcs_to_start + [repeat.item.friendly_name] }}'
        else:
        - variables:
            lxcs_already_running: '{{ lxcs_already_running + [repeat.item.friendly_name]
              }}'
  - repeat:
      sequence:
      - delay: 30
      while:
      - condition: not
        conditions:
        - condition: state
          entity_id: binary_sensor.internet_connectivity
          state: 'on'
  - action: notify.pushover_servers
    continue_on_error: true
    metadata: {}
    data:
      target: tim-iphone,mac-studio
      title: 'Calliope Power Outage: Power Restored'
      message: "Power restored at {{ now().strftime('%H:%M on %B %d') }}. Outage duration:
        {% set hours = states('sensor.ups_last_outage_duration') | float %} {%- if
        hours >= 1 -%}\n  {{ (hours | int) }} hour{{ 's' if hours | int != 1 else
        '' }} {{ ((hours % 1) * 60) | round }} minute{{ 's' if ((hours % 1) * 60)
        | round != 1 else '' }}\n{%- else -%}\n  {{ (hours * 60) | round }} minute{{
        's' if (hours * 60) | round != 1 else '' }}\n{%- endif -%} {% if lxcs_to_start
        | length > 0 %}Starting up: {{ lxcs_to_start | join(', ') }}{% endif %} {%
        if lxcs_already_running | length > 0 %}Already running: {{ lxcs_already_running
        | join(', ') }}{% endif %}"
      data:
        priority: 1
  - delay:
      hours: 0
      minutes: 2
      seconds: 0
      milliseconds: 0
  - repeat:
      for_each: '{{ lxcs_to_startup }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''off'') }}'
        then:
        - action: button.press
          metadata: {}
          data: {}
          target:
            entity_id: '{{ repeat.item.start_entity_id }}'
        - delay:
            seconds: '{{ lxc_startup_delay }}'
    enabled: true
  - action: input_boolean.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.ups_power_outage
  - action: rest_command.ups_beeper_enable
    metadata: {}
    data: {}
  variables:
    proxmox_startup_delay: 60
    lxc_startup_delay: 10
