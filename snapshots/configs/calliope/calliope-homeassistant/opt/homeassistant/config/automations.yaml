          entity_id: switch.watervalve_sprayzone_state
        action: switch.turn_on
        data: {}
      - wait_for_trigger:
        - entity_id: timer.irrigation_timer_sprayzone
          from: active
          to: idle
          trigger: state
    - target:
        entity_id: counter.irrigation_daysuntilnext_sprayzone
      data:
        value: '{{ states(''input_number.irrigation_frequency_sprayzone'') | int }}'
      action: counter.set_value
    - target:
        entity_id: input_datetime.irrigation_last_sprayzone
      data:
        datetime: '{{ now().isoformat() }}'
      action: input_datetime.set_datetime
  - if:
    - condition: numeric_state
      entity_id: counter.irrigation_daysuntilnext_lawnzone
      below: 1
    then:
    - if:
      - condition: template
        value_template: "{{\n  (states('sensor.fineoffset_wh51_0de4e5_moisture') not
          in ['unavailable', 'unknown'] and\n  states('sensor.fineoffset_wh51_0de4e5_moisture')
          | float <\n  states('input_number.irrigation_moisturetrigger_lawnzone')
          | float) or\n  (not is_state('input_boolean.irrigation_moisturetrigger_enable_lawnzone',
          'on'))\n}}"
      - condition: state
        entity_id: input_boolean.irrigation_enable_lawnzone
        state: 'on'
      then:
      - data:
