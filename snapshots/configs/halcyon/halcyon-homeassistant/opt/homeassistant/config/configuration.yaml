# MQTT Sensor
#mqtt:
#  sensor:
#    - name: "Latest Frigate Event"
#      state_topic: "frigate/events"
#      value_template: "{{ value_json['after']['id'] }}"
    

mqtt:
  sensor:
    - name: "Latest Frigate Event"
      state_topic: "frigate/events"
      value_template: "{{ value_json['after']['id'] }}"
      json_attributes_topic: "frigate/events"
      json_attributes_template: >
        {
          "label": "{{ value_json['after']['label'] }}",
          "camera": "{{ value_json['after']['camera'] }}",
          "score": "{{ value_json['after']['score'] }}",
          "start_time": "{{ value_json['after']['start_time'] }}"
        }


# UPS REST Commands

rest_command:
  ups_set_shutdown_delay:
    url: "http://10.2.1.20:8080/ups/shutdown-delay?delay={{ delay | default(180) }}"
    method: POST
    timeout: 15

  ups_load_off:
    url: "http://10.2.1.20:8080/ups/load-off"
    method: POST
    timeout: 15

  ups_load_off_delay:
    url: "http://10.2.1.20:8080/ups/load-off-delay"
    method: POST
    timeout: 15

  ups_shutdown_reboot:
    url: "http://10.2.1.20:8080/ups/shutdown-reboot"
    method: POST
    timeout: 15

  ups_shutdown_stop:
    url: "http://10.2.1.20:8080/ups/shutdown-stop"
    method: POST
    timeout: 15

  ups_beeper_disable:
    url: "http://10.2.1.20:8080/ups/beeper-disable"
    method: POST
    timeout: 15

  ups_beeper_enable:
    url: "http://10.2.1.20:8080/ups/beeper-enable"
    method: POST
    timeout: 15

  ups_set_battery_charge_low:
    url: "http://10.2.1.20:8080/ups/battery-charge-low?value={{ value | default(10) }}"
    method: POST
    timeout: 15

  ups_set_battery_runtime_low:
    url: "http://10.2.1.20:8080/ups/battery-runtime-low?value={{ value | default(120) }}"
    method: POST
    timeout: 15
    

