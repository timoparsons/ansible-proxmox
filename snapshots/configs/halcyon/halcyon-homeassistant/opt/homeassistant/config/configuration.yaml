homeassistant:
# Allow read / write access to folders
  allowlist_external_dirs:
    - "/config/www"

# Set Latitude and longitude of Home
  latitude: -37.23431423300682
  longitude: 174.71220676229447

# Customize radius of Home zone
  customize:
    zone.home:
      radius: 20
      

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes
  extra_module_url:
#    - /local/card-mod.js
    - /hacsfiles/REDACTED-card-mod/card-mod.js #Manually add card-mod for better functionality
    

# Non standard port for security
http:
  server_port: 8443 # Use your chosen port
  # These lines for Cloudflared
  use_x_forwarded_for: true
  trusted_proxies:
    - 172.30.33.0/24
    - 10.2.1.24
    

