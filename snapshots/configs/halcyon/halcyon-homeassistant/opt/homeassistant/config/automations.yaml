- id: shellies_announce_gen2
  alias: Backend - Shellies Announce Gen2
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  actions:
  - repeat:
      for_each: '{{ device_ids }}'
      sequence:
      - data:
          topic: '{{ repeat.item }}/rpc'
          payload: '{{ device_info_payload }}'
        action: mqtt.publish
  variables:
    device_info_payload: '{{ {''id'': 1, ''src'':''shellies_discovery'', ''method'':''Shelly.GetConfig''}
      | to_json }}'
    device_ids:
    - shellyplus1-a8032aba31a8
    - shelly
- id: shellies_discovery_gen2
  alias: Backend - Shellies Discovery Gen2
  description: ''
  triggers:
  - topic: shellies_discovery/rpc
    trigger: mqtt
  actions:
  - data:
      id: '{{ trigger.payload_json.src }}'
      device_config: '{{ trigger.payload_json.result }}'
    action: python_script.shellies_discovery_gen2
  - data:
      topic: '{{ trigger.payload_json.result.mqtt.topic_prefix }}/command'
      payload: status_update
    action: mqtt.publish
  mode: queued
  max: 999
