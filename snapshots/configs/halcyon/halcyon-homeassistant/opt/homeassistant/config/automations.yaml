- id: '1707447106784'
  alias: 'Driveway - Event Detected: Send iOS Notification NEW'
  description: ''
  trigger:
  - platform: mqtt
    topic: frigate/events
    id: frigate-event
    payload: Driveway
    value_template: '{{ value_json[''after''][''camera''] }}'
    variables:
      after_zones: '{{ trigger.payload_json[''after''][''entered_zones''] }}'
      before_zones: '{{ trigger.payload_json[''before''][''entered_zones''] }}'
      camera: '{{ trigger.payload_json[''after''][''camera''] }}'
      camera_label: '{{ trigger.payload_json[''after''][''camera''] | replace(''_'',
        '' '') | title }}'
      id: '{{ trigger.payload_json[''after''][''id''] }}'
      label: '{{ trigger.payload_json[''after''][''label''] | title }}'
      score: '{{ trigger.payload_json[''after''][''score''] }}'
  condition:
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''new'' }}'
    enabled: true
  - condition: state
    entity_id: input_boolean.driveway_silence_detection
    state: 'off'
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: frigate-event
      sequence:
      - service: script.send_dynamic_notification_tims_iphone
        metadata: {}
        data:
          id: '{{ id }}'
          notifTag: '{{ id }}'
          group: frigate-notification-{{ camera }}
          title: '{{ camera_label }}'
          message: '{{ label }} detected on {{ id }} '
          url: /REDACTED/recordings
          importance: time-sensitive
          image: /api/frigate/notifications/{{ id }}/snapshot.jpg
      - repeat:
          until:
          - condition: template
            value_template: '{{ wait.trigger.payload_json[''type''] == ''end'' }}'
          sequence:
          - wait_for_trigger:
            - platform: mqtt
              topic: frigate/events
              payload: '{{ trigger.payload_json[''after''][''id''] }}'
              value_template: '{{ value_json[''after''][''id''] }}'
            continue_on_timeout: false
            timeout: 00:02:00
          - condition: template
            value_template: '{{ wait.trigger.payload_json[''type''] == ''end'' }}'
          - service: script.send_dynamic_notification_tims_iphone
            data:
              id: '{{ id }}'
              title: '{% if (wait.trigger.payload_json["after"]["sub_label"] != None)
                -%} {{ (wait.trigger.payload_json["after"]["sub_label"]) | title }}
                {%- else -%} {{ label | replace("_", " ") | title }} {%- endif %}
                was detected in the {{ after_zones[0] | replace("_", " ") | title
                }}'
              message: Detected with {{ int(score | round(2) * 100) }}% confidence
              notifTag: '{{ id }}'
              group: frigate-notification-{{ trigger.payload_json["after"]["camera"]
                }}
              importance: default
              image: /api/frigate/notifications/{{ id }}/snapshot.jpg
          - service: shell_command.frigate_download_notification_snapshot
            metadata: {}
            data:
              event_id: '{{ id }}'
              output_folder: /config/www
            enabled: true
    default: []
  mode: parallel
  max: 10
