- id: '1750409779089'
  alias: 'Security - Driveway Occupancy Frigate: Dynamic Notification TEST'
  description: Send notifications for detected objects in driveway camera
  triggers:
  - entity_id:
    - binary_sensor.driveway_person_occupancy
    - binary_sensor.driveway_car_occupancy
    - binary_sensor.driveway_dog_occupancy
    - binary_sensor.driveway_cat_occupancy
    - binary_sensor.driveway_cow_occupancy
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    state: idle
    entity_id: timer.security_notifications_debounce
    enabled: true
  actions:
  - variables:
      object_type: "{% set mapping = {\n  'binary_sensor.driveway_person_occupancy':
        'person',\n  'binary_sensor.driveway_car_occupancy': 'car',\n  'binary_sensor.driveway_dog_occupancy':
        'dog',\n  'binary_sensor.driveway_cat_occupancy': 'cat',\n  'binary_sensor.driveway_cow_occupancy':
        'cow'\n} %} {{ mapping[trigger.entity_id] }}"
      image_entity: image.driveway_{{ object_type }}
      timestamp: '{{ now().strftime(''%Y%m%d_%H%M%S'') }}'
      notification_message: '{{ object_type|title }} detected in Driveway'
      full_image_url: '{{ ''http://10.2.1.120:8443'' + state_attr(''image.driveway_''
        + object_type, ''entity_picture'') }}'
  - delay:
      hours: 0
      minutes: 0
      seconds: 2
      milliseconds: 0
  - action: downloader.download_file
    data:
      url: '{{ full_image_url }}'
      filename: driveway_{{ object_type }}_{{ timestamp }}.jpg
      overwrite: false
  - delay:
      hours: 0
      minutes: 0
      seconds: 3
      milliseconds: 0
  - action: script.send_dynamic_notification_pushover_tim
    data:
      id: driveway_{{ object_type }}_{{ timestamp }}
      title: Driveway Occupancy TEST
      message: '{{ notification_message }}'
      url: homeassistant://navigate/REDACTED/recordings?server=Halcyon
      url_title: View Recordings
      image: /config/www/driveway_{{ object_type }}_{{ timestamp }}.jpg
  - action: shell_command.delete_camera_grab
    data:
      filename: driveway_{{ object_type }}_{{ timestamp }}.jpg
  mode: single
  max: 10
- id: '1751771670142'
  alias: 'Power Outage – Power OFF 0min: Set Flag'
  description: On loss of power, set input boolean for tracking and send notification.
    Notification will fail at Halcyon because fibre will be done.
  triggers:
  - trigger: state
    entity_id: sensor.halcyon_ups_status_data
    to:
    - OB DISCHRG
    - OB
    - FSD OB DISCHRG
    from:
    - OL
    - OL CHRG
    - FSD OL CHRG
  conditions: []
  actions:
  - action: input_boolean.turn_on
    metadata: {}
    data: {}
    target:
      entity_id: input_boolean.ups_power_outage
  mode: single
- id: '1751771871949'
  alias: 'Power Outage – Power OFF 2min: Shutdown LXCs'
  description: After 2 minutes of power outage, shutdown multiple Proxmox LXCs to
    conserve UPS battery.
  triggers:
  - trigger: state
    entity_id: input_boolean.ups_power_outage
    to: 'on'
    for:
      minutes: '{{ shutdown_delay_minutes }}'
  - trigger: state
    entity_id:
    - input_boolean.ups_power_outage
    to: 'on'
    from: 'off'
    for:
      hours: 0
      minutes: 2
      seconds: 0
  conditions:
  - condition: state
    entity_id: sensor.halcyon_ups_status_data
    state:
    - OB DISCHRG
    - OB
    - FSD OB DISCHRG
  actions:
  - variables:
      running_lxcs: []
      stopped_lxcs: []
  - repeat:
      for_each: '{{ lxcs_to_shutdown }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''on'') }}'
        then:
        - variables:
            running_lxcs: '{{ running_lxcs + [repeat.item.friendly_name] }}'
        else:
        - variables:
            stopped_lxcs: '{{ stopped_lxcs + [repeat.item.friendly_name] }}'
  - action: input_text.set_value
    metadata: {}
    data:
      value: 'Power still out after {{ shutdown_delay_minutes }} minutes.

        {% if running_lxcs | length > 0 %}Shutting down: {{ running_lxcs | join('',
        '') }} {% endif %}

        {% if stopped_lxcs | length > 0 %}Already stopped: {{ stopped_lxcs | join('',
        '') }} {% endif %}

        {% if running_lxcs | length == 0 and stopped_lxcs | length == 0 %} No LXCs
        found to check. {% endif %}'
    target:
      entity_id: input_text.ups_last_event
  - action: rest_command.ups_beeper_disable
    metadata: {}
    data: {}
  - action: input_text.set_value
    metadata: {}
    data:
      value: 'Halcyon Power Outage: Power went off at {{ now().strftime(''%H:%M on
        %B %d'') }}.'
    target:
      entity_id: input_text.ups_last_event
  - repeat:
      for_each: '{{ lxcs_to_shutdown }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ is_state(repeat.item.status_entity, ''on'') }}'
        then:
        - action: button.press
          metadata: {}
          data: {}
          target:
            entity_id: '{{ repeat.item.entity_id }}'
        - delay:
            seconds: 5
    enabled: true
  - action: notify.servers
    continue_on_error: true
    metadata: {}
    data:
      target: tim-iphone,mac-studio
      title: Halcyon Power Outage
      message: 'Power still out after {{ shutdown_delay_minutes }} minutes.

        {% if running_lxcs | length > 0 %}Shutting down: {{ running_lxcs | join('',
        '') }} {% endif %}

        {% if stopped_lxcs | length > 0 %}Already stopped: {{ stopped_lxcs | join('',
        '') }} {% endif %}

        {% if running_lxcs | length == 0 and stopped_lxcs | length == 0 %} No LXCs
        found to check. {% endif %}'
      data:
        priority: 1
  variables:
    shutdown_delay_minutes: 2
    lxcs_to_shutdown:
    - name: adguard
      friendly_name: Frigate
      entity_id: button.lxc_frigate_128_shutdown
      status_entity: binary_sensor.lxc_frigate_128_status
    - name: frigate
      friendly_name: Adguard
      entity_id: button.lxc_adguard_123_shutdown
      status_entity: binary_sensor.lxc_adguard_123_status
  mode: single
- id: '1751771981510'
  alias: 'Power Outage – Power OFF 5min: Shutdown Synology'
  description: After 5 minutes of power outage, shutdown Synology to conserve UPS
    battery.
  triggers:
  - trigger: state
    entity_id: input_boolean.ups_power_outage
    to: 'on'
    for:
      minutes: '{{ shutdown_delay_minutes }}'
    enabled: false
  - trigger: state
    entity_id:
    - input_boolean.ups_power_outage
    from: 'off'
    to: 'on'
    for:
      hours: 0
      minutes: 5
      seconds: 0
  conditions:
  - condition: state
    entity_id: sensor.halcyon_ups_status_data
    state:
    - OB DISCHRG
    - OB
    - FSD OB DISCHRG
  actions:
  - action: input_text.set_value
    metadata: {}
    data:
      value: Power still out after {{ shutdown_delay_minutes }} mins. Shutting down
        Synology.
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 31f1251ccfa2d95a1b434c3c7290dad8
  - delay: 00:00:05
  - action: button.press
    target:
      entity_id: button.halcyon_shutdown
    data: {}
  - action: notify.servers
    continue_on_error: true
    metadata: {}
    data:
      target: tim-iphone,mac-studio
      title: Halcyon Power Outage
      message: 'Power still out after {{ shutdown_delay_minutes }} mins.

        Shutting down Synology.'
      data:
        priority: 1
    enabled: true
  mode: single
  variables:
    shutdown_delay_minutes: 5
