- id: '1707295712032'
  alias: 'Driveway - Event Detected: Send iOS Notification'
  description: ''
  trigger:
  - platform: mqtt
    topic: frigate/events
    id: frigate-event
    payload: Driveway
    value_template: '{{ value_json[''after''][''camera''] }}'
    variables:
      after_zones: '{{ trigger.payload_json[''after''][''entered_zones''] }}'
      before_zones: '{{ trigger.payload_json[''before''][''entered_zones''] }}'
      camera: '{{ trigger.payload_json[''after''][''camera''] }}'
      camera_label: '{{ trigger.payload_json[''after''][''camera''] | replace(''_'',
        '' '') | title }}'
      id: '{{ trigger.payload_json[''after''][''id''] }}'
      label: '{{ trigger.payload_json[''after''][''label''] }}'
      score: '{{ trigger.payload_json[''after''][''score''] }}'
      time_clip_start: '{{ trigger.payload_json[''after''][''start_time''] - 10.0
        }}'
  condition:
  - condition: template
    value_template: '{{ trigger.payload_json[''type''] == ''new'' }}'
    enabled: true
  - condition: state
    entity_id: input_boolean.driveway_silence_detection
    state: 'off'
  action:
  - service: script.send_dynamic_notification_tims_iphone
    metadata: {}
    data:
      id: '{{ id }}'
      title: '{{ camera_label }}'
      message: '{{ label }} detected on {{ id }}'
      url: /REDACTED/recordings
      importance: time-sensitive
      image: /api/frigate/notifications/{{ id }}/snapshot.jpg
  mode: single
  max: 10
