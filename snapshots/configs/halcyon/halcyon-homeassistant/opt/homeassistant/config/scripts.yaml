driveway_security_lights_toggle:
  alias: Driveway Security Lights – Toggle
  sequence:
  - service: light.toggle
    metadata: {}
    data: {}
    target:
      entity_id: light.security_lights
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  mode: single
send_dynamic_pushover_notification:
  alias: send_dynamic_notification_pushover
  sequence:
  - service: notify.pushover
    metadata: {}
    data:
      title: '{{ title }}'
      message: '{{ message }}'
      data:
        attachment: '{{ image }}'
        priority: '{{ states(''sensor.dick_notification_level'') }}'
        retry: '{% if priority == 2 %} 30 {% else %} 0 {% endif %}'
        expire: '{% if priority == 2 %} 300 {% else %} 0 {% endif %}'
        url: '{{ url }}'
        url_title: '{{ url_title }}'
      target: dick-iphone
  - service: notify.pushover
    metadata: {}
    data:
      title: '{{ title }}'
      message: '{{ message }}'
      data:
        attachment: '{{ image }}'
        priority: '{{ states(''sensor.helen_notification_level'') }}'
        retry: '{% if priority == 2 %} 30 {% else %} 0 {% endif %}'
        expire: '{% if priority == 2 %} 300 {% else %} 0 {% endif %}'
        url: '{{ url }}'
        url_title: '{{ url_title }}'
      target: helen-iphone
  - service: notify.pushover_tim
    metadata: {}
    data:
      title: '{{ title }}'
      message: '{{ message }}'
      data:
        attachment: '{{ image }}'
        priority: '{{ states(''sensor.dick_notification_level'') }}'
        retry: '{% if priority == 2 %} 30 {% else %} 0 {% endif %}'
        expire: '{% if priority == 2 %} 300 {% else %} 0 {% endif %}'
        url: '{{ url }}'
        url_title: '{{ url_title }}'
      target: tim-iphone
    enabled: false
  mode: parallel
send_ios:
  alias: send_ios
  sequence:
  - service: notify.mobile_app_tims_iphone
    data:
      message: Person Detected
      title: Driveway Camera
      data:
        image: http://halcyon.timparsons.nz/api/frigate/notifications/1707289205.739932-fj74po/snapshot.jpg
        url: /lovelace/recordings
        push:
          interruption-level: time-sensitive
  mode: single
send_dynamic_notification_tims_iphone:
  alias: send_dynamic_notification_tims_iphone
  sequence:
  - service: notify.mobile_app_tims_iphone
    data:
      message: '{{ message }}'
      title: '{{ title }}'
      data:
        image: '{{ image }}'
        url: '{{ url }}'
        push:
          interruption-level: '{{ importance }}'
  mode: single
'1707443901492':
  alias: Frigate - Download Latest Snapshot
  sequence:
    service: shell_command.frigate_download_notification_snapshot
    metadata: {}
    data:
      event_id: '{{ states(''sensor.latest_frigate_event'') }}'
      output_folder: /config/www
    enabled: true
