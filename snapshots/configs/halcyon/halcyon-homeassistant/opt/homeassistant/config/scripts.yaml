send_dynamic_notification_pushover_tim:
  alias: send_dynamic_notification_pushover_tim
  sequence:
  - metadata: {}
    data:
      title: '{{ title }}'
      message: '{{ message }}'
      data:
        attachment: '{{ image }}'
        priority: '{{ priority }}'
        retry: '{% if priority == 2 %} 30 {% else %} 0 {% endif %}'
        expire: '{% if priority == 2 %} 300 {% else %} 0 {% endif %}'
        url: '{{ url }}'
        url_title: '{{ url_title }}'
      target: tim-iphone,mac-studio
    action: notify.servers
  mode: parallel
  max: 10
backend_toggle_lxc_container:
  alias: Backend – Toggle LXC Container
  description: 'Toggle LXC container by name: start if off, stop if on.'
  fields:
    lxc_name:
      description: The name part of the LXC entities, e.g., jellyfin_143
      example: jellyfin_143
      required: true
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ is_state(''binary_sensor.lxc_'' ~ lxc_name ~ ''_status'',
          ''on'') }}

          '
      sequence:
      - target:
          entity_id: 'button.lxc_{{ lxc_name }}_shutdown

            '
        action: button.press
    - conditions:
      - condition: template
        value_template: '{{ is_state(''binary_sensor.lxc_'' ~ lxc_name ~ ''_status'',
          ''off'') }}

          '
      sequence:
      - target:
          entity_id: 'button.lxc_{{ lxc_name }}_start

            '
        action: button.press
backend_restart_lxc_container:
  sequence:
  - target:
      entity_id: 'button.lxc_{{ lxc_name }}_reboot

        '
    action: button.press
  alias: Backend – Restart LXC Container
  description: Restart LXC container by name
  fields:
    lxc_name:
      description: The name part of the LXC entities, e.g., jellyfin_143
      example: jellyfin_143
      required: true
backend_toggle_home_assistant_vm:
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.qemu_haos11_4_120_status
      state: 'on'
    then:
    - action: button.press
      metadata: {}
      data: {}
      target:
        entity_id: button.qemu_haos11_4_120_shutdown
    else:
    - action: button.press
      metadata: {}
      data: {}
      target:
        entity_id: button.qemu_haos11_4_120_start
  alias: Backend – Toggle Home Assistant VM
  description: 'Toggle VM: start if off, stop if on.'
  fields: {}
