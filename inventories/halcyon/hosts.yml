# Halcyon site (10.2.1.0/24, parents' house). Rebuilt 2026-10-13 from the live guests.
# SSH works from the Ansible host on these hosts only. The other guests (CT 100, 122, 123, 124, 148) have no Ansible key
# and are reached through the Proxmox host with pct exec. Not covered: CT 164 (stopped spare) and VM 120 (old HAOS VM).
# Groups: proxmox_hosts, guests, maintenance_skip.
all:
  children:
    proxmox_hosts:
      hosts:
        halcyon-proxmox:
          ansible_host: 10.2.1.20
    guests:
      hosts:
        halcyon-mqtt:
          ansible_host: 10.2.1.25
        halcyon-frigate:
          ansible_host: 10.2.1.28
    maintenance_skip:
      hosts: {}
